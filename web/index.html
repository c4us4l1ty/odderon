// timeout. `gl.clientWaitSync` returns a status we can READ, which is what makes this honest.
//
// It blits into an OFFSCREEN target of the cache's own size, never into the default framebuffer. This
// is the mechanism: `blitOnce()` in `upperBoundBlit()` draws into the default framebuffer 64 times, and
// a naive fence-based version of this function would do the same once per frame and put presentation
// and its 4.00 ms vsync wait back on the clock -- the exact defect `upperBoundBlit()` documents having
// already committed once. An offscreen blit is still a real blit: same source, same size, same
// `NEAREST` filter, and `tools/check-astro-bench.mjs` asserts the numbers are equal when both can be
// resolved. What it does not include is presentation, so the figure is a lower bound in that one
// respect, and the panel says so rather than implying it is a whole frame.
//
// AND IT REFUSES TO REPORT WHAT IT CANNOT SEE. Run on a machine whose clock or driver cannot resolve a
// single blit -- SwiftShader here, where a whole frame reads 0.00-0.30 ms at 1 ms granularity -- this
// returns a null figure and the reason, instead of a decimal. A measurement whose resolution exceeds
// the thing it measures is the "number at the limit of resolution is a fake claim" failure this
// project has already been bitten by.
// Below this, a per-frame wall-clock figure is not resolvable by this method on any backend we have.
const RES_MIN_MS = 0.01;

async function directBlitMs(frames = 32) {
  if (!cache.probeFbo) return { ms: null, reason: 'no offscreen target' };
  if (typeof gl.fenceSync !== 'function' || typeof gl.clientWaitSync !== 'function') {
    return { ms: null, reason: 'fenceSync unavailable' };
  }
  const W = cache.w;
  const H = cache.h;
  const med = (xs) => { const a = xs.slice().sort((p, q) => p - q); return a[a.length >> 1]; };

  // THE STOPWATCH'S OWN PRICE, measured in the same loop shape. Without this the figure includes
  // fence creation and the wait call itself, which on these backends is comparable to the work.
  // THE OVERHEAD LOOP MUST HAVE THE SAME SHAPE AS THE MEASURED LOOP, yield included.
  //
  // The first version of this used a single `clientWaitSync` with a large timeout and no `await`, so
  // it measured 0.1 ms while the measured loop -- which yields a tick so the driver can signal --
  // measured 4.0 ms. Subtracting one from the other credited 3.9 ms of SCHEDULER to the renderer, and
  // the refusal message then read "yield floor 0.1 ms exceeds the 1.5 ms budget", which is arithmeti-
  // cally absurd and would have been shipped as a finding. Measure the same loop with the blit removed.
  const empty = [];
  for (let i = 0; i < 8; i++) {
    const t0 = performance.now();
    const f = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
    gl.flush();
    let st0 = gl.clientWaitSync(f, 0, 0);
    if (st0 === gl.TIMEOUT_EXPIRED) {
      await new Promise((r) => setTimeout(r, 0));
      gl.clientWaitSync(f, gl.SYNC_FLUSH_COMMANDS_BIT, 0);
    }
    gl.deleteSync(f);
    empty.push(performance.now() - t0);
  }
  const overhead = med(empty);

  const per = [];
  let timedOut = 0;
  for (let i = 0; i < frames; i++) {
    const t0 = performance.now();
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, cache.fbo);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, cache.probeFbo);
    gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    const f = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
    gl.flush();
    // Bounded wait. `SYNC_OBJECT_ALREADY_SIGNALED` / `CONDITION_SATISFIED` both mean it completed;
    // anything else means this sample must not be counted as a measurement.
    // WAITING ON A FENCE NEEDS BOTH A LEGAL TIMEOUT AND A YIELDED MAIN THREAD.
    //
    // Two measured mistakes, both of which made this function report "32 fences timed out" on a
    // backend where every fence was completing:
    //
    //  1. `5e7` is not a legal timeout here. `clientWaitSync` takes a GLint64, but this binding hands
    //     anything large enough to `WAIT_FAILED` (37149) rather than a timeout.
    //  2. A busy-poll on `performance.now()` never lets the driver signal. Polled with `timeout = 0`
    //     the fence reads TIMEOUT_EXPIRED, then CONDITION_SATISFIED, then ALREADY_SIGNALED -- but only
    //     when 30 ms of real wall clock passes between polls. A tight loop burns its whole budget
    //     inside the first millisecond and sees nothing but TIMEOUT_EXPIRED.
    //
    // So: ONE yielded tick, which is what the driver needs to signal, and never a spin. The cost of
    // the yield itself is subtracted below, so what is left is the blit.
    let st = gl.clientWaitSync(f, 0, 0);
    if (st === gl.TIMEOUT_EXPIRED) {
      // MEASURED: a `setTimeout(0)` loop is NOT a cheap way to wait. Each tick is clamped to ~4 ms
      // here, and this loop needed about five of them, so a blit-plus-wait read 20.8 ms when the same
      // yield with NO GPU work at all already cost 4.2 ms and `finish()` after a single tick cost
      // 4.1 ms. The number being measured had become the polling loop.
      //
      // One timer tick is enough for the driver to signal -- the fence goes TIMEOUT_EXPIRED, then
      // CONDITION_SATISFIED, within a single yielded task. So: poll once, then wait on the timer
      // rather than on the status.
      await new Promise((r) => setTimeout(r, 0));
      st = gl.clientWaitSync(f, gl.SYNC_FLUSH_COMMANDS_BIT, 0);
    }
    gl.deleteSync(f);
    if (st === gl.WAIT_FAILED) {
      timedOut++;
    } else {
      // TIMEOUT_EXPIRED after one yield is not a failure -- the fence is just not idle yet. The
      // elapsed time is a real completion interval and is counted as such; only WAIT_FAILED means the
      // driver refused the question.
      per.push(Math.max(0, performance.now() - t0));
    }
  }
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);

  if (per.length < 8) return { ms: null, reason: 'fences did not complete (' + timedOut + ' timed out)' };

  // THE FLOOR OF THIS METHOD IS THE SCHEDULER, NOT THE GPU -- measured, and it is over budget.
  //
  // Signalling a fence requires yielding to the event loop, and one `setTimeout(0)` tick on this
  // backend costs 4.1 ms (median of 16; minimum 0, so it is the CLAMP, not the work). The whole R2
  // budget is 1.5 ms. Measured on the same page: a tick with NO GPU work at all 4.1 ms, the same tick
  // with a fence and no blit 4.2 ms, a blit plus that tick 4.0-4.2 ms. The blit does not move the
  // number, because the number IS the yield.
  //
  // So `per` medians around 4 ms whatever the renderer does, and reporting it would put "4.00 ms
  // direct" on the panel as though the renderer had been measured. That is the "measurement whose
  // method is hidden" defect this file has fixed four times. When the method's own floor is above the
  // budget it is being asked about, the honest output is the floor and a refusal.
  const floor = overhead;
  // NEVER NEGATIVE. Both terms are samples of the same scheduler-bound clock, so their difference can
  // come out below zero by the width of the tick -- and it did: the panel printed "~-0.1 ms frame",
  // a negative time, because `toFixed(1)` on -0.05 renders as "-0.1". A physical quantity that cannot
  // be negative must not be printed as one.
  const aboveFloor = Math.max(0, med(per) - floor);
  if (aboveFloor < RES_MIN_MS) {
    // The blit does not move the number above the method's own floor, so there is nothing here about
    // the renderer. Say which of the two floors stopped it -- the scheduler clock or the GPU clock --
    // because they lead to different next steps.
    const why = floor > 1.5
      ? 'a yield costs ' + floor.toFixed(1) + ' ms on this device, over the 1.5 ms budget'
      : 'the blit is below the ' + floor.toFixed(2) + ' ms floor of this method';
    return { ms: null, reason: why, floor };
  }

  // A HALF-PERIOD GUARD ON THE CLOCK. `performance.now()` is coarsened on purpose by browsers, so a
  // distribution that never leaves a single tick cannot be averaged into a real number: the median is
  // the tick, not the renderer. If the samples do not span at least two distinct values, there is no
  // measurement here to report.
  const distinct = new Set(per.map((v) => v.toFixed(3))).size;
  if (distinct < 2) {
    return {
      ms: null,
      reason: 'below the timer resolution (' + per.length + ' frames, all ' + per[0].toFixed(2) + ' ms)',
    };
  }

  const corrected = Math.max(0, aboveFloor);
  bench.directOverheadMs = overhead;
  bench.directFrames = per.length;
  // The figure is a DIFFERENCE between two samples of a 4 ms-bound scheduler, so its resolution is
  // the tick, not a hundredth of a millisecond. Carried out with the number so nothing downstream can
  // print "0.20 ms" and let a reader assume it is resolved to 0.01.
  bench.directUncertaintyMs = 0.1;
  // If the corrected figure is indistinguishable from the tick, report the tick as the resolution
  // rather than a decimal -- the same "< 0.01" rule the frame row uses, applied to the caveat.
  return { ms: corrected, overhead, uncertainty: 0.1, timedOut, frames: per.length };
}

function upperBoundBlit(samples = 12) {
  if (!cache.probeFbo) return null;
  // ONE `gl.finish()` FOR K BLITS -- NOT ONE PER BLIT. This is the whole mechanism and it was wrong
  // twice before it was right.
  //
  // Version 1 called `readPixels` after every blit. On ANGLE that costs 9.3 ms against `finish()`'s
  // 0.008 ms, so the "upper bound" was a measurement of the readback. Version 2 changed it to
  // `gl.finish()` after every blit, which is fine on a desktop driver and useless on a phone: there,
  // `finish()` waits for the next refresh boundary, so K iterations pay K refresh periods. Reference B
  // reported `< 4.08 ms` at a 250 Hz display -- 4.00 ms, i.e. the display again, dressed as a bound.
  // That is the same error this file already documents for the blit measurement, committed inside the
  // fix for it.
  //
  // The right shape is the one `measureFrame()` uses for its shade loop: issue every unit of work, then
  // ONE completion. T then pays the presentation stall once, and T/K is amortised over K frames of real
  // GPU work rather than over one wait.
  //
  // `samples` is chosen from the observed blit rate so this finishes in a few milliseconds, and clamped
  // so that a pathologically slow device still terminates: the ceiling is ~128 frames of work.
  const blitOnce = () => {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, cache.probeFbo);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
    gl.blitFramebuffer(0, 0, cache.w, cache.h, 0, 0, canvas.width, canvas.height,
                       gl.COLOR_BUFFER_BIT, gl.NEAREST);
  };

  // A FIXED batch, not a calibrated one.
  //
  // Sizing the batch from a one-blit-plus-finish probe is circular: that probe is dominated by the very
  // presentation wait the batch exists to amortise, so a phone measuring 4 ms of vsync would ask for
  // `4/4 = 1` blit and pay the full stall again. The batch size must come from what the figure needs,
  // which is "large enough that the stall divided by K is negligible", not from what the device did.
  //
  // K = 64. On a 250 Hz phone with a 4 ms refresh, the single presentation wait contributes 0.06 ms per
  // frame to the figure below -- against a 1.5 ms budget, and in the conservative direction. On a device
  // where one blit costs a full millisecond, sixty-four of them is still under a tenth of a second, so
  // the button stays responsive.
  const K = 64;
  blitOnce();
  gl.finish();                                  // warm: deferred driver setup, and one paid stall

  const t0 = performance.now();
  for (let i = 0; i < K; i++) blitOnce();
  gl.finish();                                  // ONE completion for all K
  const per = (performance.now() - t0) / K;
  bench.blitBoundBatch = K;
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  return per;
}

// ---------------------------------------------------------------------------------------------
// an explicit measurement, for browsers that will not expose GPU timers
// ---------------------------------------------------------------------------------------------
//
// gl.finish() is a synchronous GPU stall and PERFORMANCE.md forbids it in the frame loop. It is not in
// the loop: it is here, behind a button, once, and the result is labelled as having used a stall. That
// is the difference between measuring and cheating — the loop stays clean, and the number is honest
// about how it was obtained.
async function measureFrame(samples = 12) {
  // There are now TWO costs, and reporting one number for both would be the same class of error this
  // instrument has already been fixed for twice. So they are measured and labelled separately:
  //
  //   SHADE  - the expensive path, run only when something changed
  //   BLIT   - the per-frame path, which is what a static scene actually pays
  //
  // R2 is about the second one. The first one is what the user pays when the world moves.
  cacheResize(canvas.width, canvas.height);
  const sun = sunDirection(solarDeclination(Date.now()));

  const shadeTimes = [];
  const blitTimes = [];

  gl.useProgram(prog);
  gl.viewport(0, 0, cache.w, cache.h);
  gl.bindFramebuffer(gl.FRAMEBUFFER, cache.fbo);
  const t = performance.now() / 1000;
  for (let i = 0; i < samples; i++) {
    const a = performance.now();
    gl.uniform1f(U.time, t + i * 0.016);
    gl.uniform3fv(U.orbitPos, orbitPosition(t + i * 0.016));
    gl.uniform3fv(U.sunDir, sun);
    gl.uniform1f(U.frame, i);
    gl.uniform1f(U.exposure, state.exposure);
    // THE ROOM. `uRoomLight` is the network's ratio of two solar gains, not a brightness constant:
    // closing the curtain makes it 0.0833 because SHGC went from 0.60 to 0.05, and nothing else did.
    gl.uniform1f(U.roomLight, Number.isFinite(roomState.lightFraction) ? roomState.lightFraction : 0.0);
    gl.uniform1f(U.curtain, roomState.curtain ? 1.0 : 0.0);
    gl.uniform3fv(U.winC, WINDOW_CENTRE);
    gl.uniform2fv(U.winHalf, WINDOW_HALF);
    gl.uniform1i(U.taps, state.shadowTaps);
    gl.uniform1f(U.simple, state.simpleGeometry);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.finish();                                  // the deliberate stall, once per sample
    shadeTimes.push(performance.now() - a);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  // The measured pass is `blitFrame()` -- the same function the live loop calls -- so what is reported
  // cannot differ from what is drawn.
  gl.viewport(0, 0, canvas.width, canvas.height);

  // -------------------------------------------------------------------------------------------
  // The blit is timed two ways, and the difference between them is not a detail.
  //
  // `gl.finish()` on a phone does NOT report how long the GPU took. It reports when the driver had
  // nothing left to hand over, which for the per-frame blit is *the next vsync*: the frame is queued,
  // the compositor presents it at the refresh boundary, and finish() returns at that boundary. What
  // gets measured is therefore one refresh period, whatever the renderer did.
  //
  // This is not a theory. On a 143 Hz phone this loop reported a blit median of 7.00 ms. 1000/143 is
  // 6.993 ms. The number was the display, to within 0.007 ms, wearing a frame-time label.
  //
  // So when EXT_disjoint_timer_query_webgl2 is available, use it: it timestamps inside the GPU and
  // is immune to presentation. When it is not, still collect the finish() number, but label it as a
  // vsync interval so that nothing downstream can mistake it for renderer cost.
  // -------------------------------------------------------------------------------------------
  const gpuBlits = [];
  if (disjointExt) {
    // ---------------------------------------------------------------------------------------------
    // ONE QUERY AT A TIME, EACH POLLED TO COMPLETION BEFORE THE NEXT IS ISSUED.
    //
    // The version this replaces issued all twelve queries up front, `gl.finish()`ed once, and read them
    // back after a single fixed number of frames. Two separate faults, both found on real devices:
    //
    //  1. IT READ TOO EARLY. A reference-device run reported "5.00 ms vsync-bound, no GPU timer" — the
    //     extension was present and every sample was discarded as unready. Measured here: immediately
    //     after `gl.finish()` QUERY_RESULT_AVAILABLE is FALSE, and it becomes TRUE two frames later.
    //     finish() drains the command queue; it does not wait for the driver's timing bookkeeping.
    //
    //  2. A BATCH OF QUERIES IS NOT AS RELIABLE AS ONE. With twelve queries outstanding around real
    //     work, this sandbox left some permanently unready and reported one blit at 6 673 632 ns — 6.7 ms
    //     for an operation that times at 1 395 ns measured on its own. Nothing was wrong with the blit;
    //     the batch was.
    //
    // Serial measurement costs a few extra frames per sample and removes both. It also makes each
    // sample's provenance checkable: it is ready, it is not disjoint, and it is the one that was just
    // issued.
    //
    // The busy-wait trap this file already documents is avoided rather than re-learned: polling always
    // yields through rAF, never spins.
    const diag = { issued: 0, ready: 0, disjoint: 0, kept: 0, waitedFrames: 0 };
    for (let i = 0; i < samples; i++) {
      const q = gl.createQuery();
      gl.beginQuery(disjointExt.TIME_ELAPSED_EXT, q);
      blitFrame();
      gl.endQuery(disjointExt.TIME_ELAPSED_EXT);
      gl.finish();
      diag.issued += 1;

      // Bounded by TIME as well as frames. A frame cap alone is not a latency bound: at 30 Hz, thirty
      // frames is a second, and one unready query out of twelve would spend the whole budget waiting
      // for a sample that is already lost. Measured consequence of getting this wrong: 1.9 s to press a
      // button that should feel instant.
      const waitStart = performance.now();
      diag.totalWaitMs = diag.totalWaitMs || 0;
      let f = 0;
      while (f < GPU_QUERY_WAIT_FRAMES &&
             performance.now() - waitStart < GPU_QUERY_WAIT_MS &&
             !gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) {
        await new Promise((r) => requestAnimationFrame(r));
        f += 1;
      }
      diag.waitedFrames = Math.max(diag.waitedFrames, f);
      diag.waitedMs = Math.max(diag.waitedMs || 0, Math.round(performance.now() - waitStart));
      diag.totalWaitMs += Math.round(performance.now() - waitStart);

      const ready = gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE);
      const disjoint = gl.getParameter(disjointExt.GPU_DISJOINT_EXT);
      if (ready) diag.ready += 1;
      if (disjoint) diag.disjoint += 1;
      // The first two are discarded: a cold pipeline reads milliseconds on hardware that does the work
      // in microseconds, and this file already carries that lesson from the boot burst.
      if (ready && !disjoint && i >= 2) {
        gpuBlits.push(gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6);
        diag.kept += 1;
      }
      gl.deleteQuery(q);
    }
    bench.gpuQueryDiag = diag;
  }

  // Fall back to the finish() path when there is no timer query *or* when one exists but produced no
  // usable sample. The second case is real: a browser can expose the extension and still return
  // unready or disjoint results, and an empty sample set must not become a NaN on the panel -- a blank
  // reads as "not measured", which is exactly the ambiguity this instrument exists to remove.
  if (gpuBlits.length === 0) {
    for (let i = 0; i < samples; i++) {
      const a = performance.now();
      blitFrame();
      gl.finish();
      blitTimes.push(performance.now() - a);
    }
  }

  const med = (xs) => { const s = xs.slice().sort((p, q) => p - q); return quantile(s, 0.5); };
  const p95f = (xs) => { const s = xs.slice().sort((p, q) => p - q); return quantile(s, 0.95); };

  bench.shadeMs = med(shadeTimes);
  bench.shadeP95 = p95f(shadeTimes);
  // THE REPORTED BLIT IS THE GPU NUMBER WHENEVER THERE IS ONE.
  //
  // `blitTimes` is the `gl.finish()` interval, which on a phone is one refresh period and is collected
  // only as a last resort. Reporting it as "BLIT" when the GPU timer produced ten real samples put
  // `NaN ms` on the panel next to a populated `R2 0.00 ms` -- two fields describing the same quantity
  // and disagreeing, because the fallback loop had not run and the fields were filled from different
  // sources. One source, one number.
  bench.gpuBlitMs = gpuBlits.length ? med(gpuBlits) : NaN;
  // When there is no GPU timer AND no usable sample set, the finish() interval is a refresh period and
  // says nothing about the renderer. That is exactly Reference B's situation, so the upper bound is
  // measured there and reported as an upper bound, never as a frame time.
  bench.blitUpperMs = (!Number.isFinite(bench.gpuBlitMs) && bench.gpuTimerState !== 'ok')
    ? (upperBoundBlit(12) ?? NaN) : NaN;
  // A DIRECT per-frame number outranks the amortised estimate, because it is what claim 4 asks for:
  // one frame, measured, rather than T/K with a stall divided out. Attempted only when there is no GPU
  // timer -- where a timer exists it is strictly better and already reported as `gpuBlitMs`.
  const direct = (!Number.isFinite(bench.gpuBlitMs) && bench.gpuTimerState !== 'ok')
    ? await directBlitMs(32) : { ms: null, reason: 'gpu timer supplied a median' };
  bench.directBlitMs = direct.ms;
  bench.directBlitReason = direct.reason || null;
  bench.directBlitOverheadMs = direct.overhead ?? NaN;
  bench.directBlitFrames = direct.frames ?? 0;
  bench.blitMs = gpuBlits.length ? bench.gpuBlitMs : med(blitTimes);
  bench.blitP95 = gpuBlits.length ? p95f(gpuBlits) : p95f(blitTimes);
  // The sorted stalled sample set, kept so the readout can print a percentile of the SAME samples as
  // the median it shows rather than a separate, never-assigned field. Empty on a device with a GPU
  // timer, because then the median is a GPU number and there is no stalled distribution to describe.
  bench.blitSamplesSorted = gpuBlits.length ? [] : blitTimes.slice().sort((a, b) => a - b);
  bench.measuredMs = bench.blitMs;
  // The resolution of the stalled measurement, so the readout can refuse to print a number finer than
  // the thing that produced it. On a GPU that reports its blit as 0.00 ms, `fmt()` printed "0.00 ms
  // stalled" -- which reads as "not measured" or as "free" and is neither.
  bench.measuredResMs = 0.01;
  bench.gpuBlitP95 = gpuBlits.length ? p95f(gpuBlits) : NaN;
  // Two different reasons can leave us without a GPU number, and they are not the same finding:
  //   'absent'      - the extension does not exist, so the finish() interval is all there is.
  //   'no-samples'  - the extension exists but returned nothing usable. That is a bug in this
  //                   instrument or a driver quirk, NOT a licence to call the number vsync.
  // Collapsing them would let a broken query masquerade as a perfectly normal software renderer.
  bench.gpuTimerState = gpuBlits.length ? 'ok' : disjointExt ? 'no-samples' : 'absent';
  bench.blitIsVsyncBound = bench.gpuTimerState === 'absent';

  cache.valid = false;                             // the loop above left the cache in an unknown state
  return {
    shade: bench.shadeMs,
    shadeP95: bench.shadeP95,
    blit: bench.blitMs,
    blitP95: bench.blitP95,
    gpuBlit: bench.gpuBlitMs,
    blitIsVsyncBound: bench.blitIsVsyncBound,
    samples,
  };
}

// ---------------------------------------------------------------------------------------------
// HUD
// ---------------------------------------------------------------------------------------------

const fmt = (v, d = 2) => (Number.isFinite(v) ? v.toFixed(d) : '—');

function updateHud() {
  // The idle check compares a frame count against itself. Without a remembered baseline, "0 frames
  // while idle" is trivially true for a renderer that never drew at all.
  if (bench.framesAtIdleCheck === undefined) bench.framesAtIdleCheck = bench.framesDrawn;
  const submitSorted = bench.submitSamples.slice().sort((a, b) => a - b);
  const med = quantile(submitSorted, 0.5);
  const p95 = quantile(submitSorted, 0.95);

  const gpuSorted = bench.gpuSamples.slice().sort((a, b) => a - b);
  const gpuMed = quantile(gpuSorted, 0.5);
  const gpuP95 = quantile(gpuSorted, 0.95);

  // WHAT THIS NUMBER IS, exactly. It matters because the whole point of the instrument is that it
  // cannot flatter the renderer.
  //
  //  * `gpu`   — from EXT_disjoint_timer_query_webgl2. The real thing, when the browser exposes it.
  //  * `measured` — from measureFrame(): N frames back-to-back with a synchronous gl.finish() inside,
  //    so it is genuine wall-clock time spent producing a frame. It is labelled with the stall because
  //    PERFORMANCE.md forbids finish() in the loop, and a measurement whose method is hidden is a
  //    measurement you cannot trust.
  //  * `submit` — CPU time to submit the draw, with no guarantee the GPU has done anything. This is
  //    NOT a frame time and is deliberately never presented as one.
  //
  // An earlier version showed "fps 6667" computed from submit time. That was not a rounding error, it
  // was a different quantity wearing the same label.
  // Order of preference, and each branch labels itself:
  //   1. the GPU timer, median of steady-state samples, with the count shown
  //   2. the explicit measure button's stalled measurement
  //   3. CPU submit time, explicitly called submit time
  // The median row and the p95 row always describe the SAME quantity. An earlier version could show
  // a GPU median above a submit p95, which reads as two numbers about one thing when they were two
  // numbers about two different things.
  if (gpuSorted.length >= 4) {
    $('m-frame').textContent = fmt(gpuMed) + ' ms gpu';
    $('m-p95').textContent = fmt(gpuP95) + ' ms  (n=' + gpuSorted.length + ')';
    $('m-fps').textContent = fmt(1000 / gpuMed, 0) + '  (1/gpu)';
  } else if (Number.isFinite(bench.measuredMs)) {
    // BELOW THE RESOLUTION OF THE MEASUREMENT, SAY SO INSTEAD OF PRINTING A ZERO.
    //
    // `bench.measuredP95` is never assigned, so this branch used to print `-- ms` with a hard-coded
    // "(n=12)" beside it: a percentile that does not exist, labelled with a sample count that was a
    // literal. It is now derived from the same sorted sample set as the median, so the two rows always
    // describe one quantity -- the invariant stated above -- and the count is the real one.
    //
    // `blitSamples` is empty when the GPU timer produced the median, and in that case there is no
    // stalled p95 to report at all, so the row says that rather than inventing one.
    const stalledN = bench.blitSamplesSorted ? bench.blitSamplesSorted.length : 0;
    const stalledP95 = stalledN ? quantile(bench.blitSamplesSorted, 0.95) : NaN;
    const res = bench.measuredResMs || 0.01;
    const below = bench.measuredMs < res;
    $('m-frame').textContent = below
      ? '< ' + res.toFixed(2) + ' ms stalled'
      : fmt(bench.measuredMs) + ' ms stalled';
    $('m-p95').textContent = stalledN
      ? (stalledP95 < res ? '< ' + res.toFixed(2) : fmt(stalledP95)) + ' ms  (n=' + stalledN + ')'
      : '—  (gpu median, no stalled samples)';
    // No frame rate from a sub-resolution frame time. `1000 / 0.01` is 100000, and printing
    // "> 100000 (1/frame)" is arithmetically true and physically absurd: presentation is bounded by the
    // display, not by this number. The row says the rate is unresolved instead.
    $('m-fps').textContent = below ? 'faster than the timer' 
                                   : fmt(1000 / bench.measuredMs, 0) + '  (1/frame)';
  } else {
    $('m-frame').textContent = fmt(med, 3) + ' ms submit only';
    $('m-p95').textContent = fmt(p95, 3) + ' ms submit';
    $('m-fps').textContent = 'press measure';
  }

  // The two costs, kept apart. A static frame costs the blit; a frame that changes costs both.
  // WHICH MECHANISM IS LIVE, stated on the panel. If the blit probe failed, this renderer is running the
  // texture-read triangle instead, and its cost is 1.65 ms at 1.04 Mpx rather than the blit's 1.27 ms.
  // A page that reports a frame time without saying which operation produced it is the bug that cost
  // this project its R2 claim once already.
  // Kept short enough for one line: the panel reflows when this wraps, and a HUD that moves depending
  // on which mechanism is live makes two screenshots harder to compare than they need to be.
  $('m-path').textContent = (bench.lastPath === 'shade' ? 'shade + ' : '') +
    (blitSupported ? 'blitFramebuffer' : 'tex read (blit off)');
  // A cost that prints as "0.00" reads as "not measured", which is why the frame row says "< 0.01"
  // instead. The same rule applies to the two costs: below the timer's resolution, say so.
  const cost = (v, d = 2) => (v < 0.01 ? '< 0.01' : fmt(v, d));
  $('m-shade').textContent = Number.isFinite(bench.shadeMs)
    ? cost(bench.shadeMs) + ' ms'
    : (cache.fullShades ? cost(cache.lastFullShadeMs, 1) + ' ms (last)' : '—');
  $('m-blit').textContent = Number.isFinite(bench.blitMs)
    ? cost(bench.blitMs) + ' ms'
    : cost(cache.lastBlitMs) + ' ms (last)';
  $('m-draws').textContent = (bench.lastPath === 'shade' ? 2 : 1) + ' per frame';

  // The room. Watts, and the ratio the shader actually uses, side by side -- because the picture is a
  // consequence of the second and a reader is entitled to see the first.
  const haveRoom = Number.isFinite(roomState.solarW);
  $('m-solar').textContent = haveRoom
    ? fmt(roomState.solarW, 0) + ' W  ' + (roomState.lightFraction * 100).toFixed(1) + '%'
    : '— no kernel';
  $('m-draw').textContent = haveRoom ? fmt(roomState.drawW, 0) + ' W' : '— no kernel';
  // `undefined` is the honest third state: the room is not a slider, so it has no value before the
  // network has answered. The row says so rather than showing "open" because that is the default.
  $('m-curtain').textContent = roomState.source === 'unavailable'
    ? 'unknown (no kernel)'
    : (roomState.curtain ? 'closed' : 'open');
  const bpp = bench.lastPixels > 0 ? bench.lastBytes / bench.lastPixels : NaN;
  $('m-bpp').textContent = fmt(bpp, 1) + ' B/px';
  $('m-write').textContent = (bench.lastBytes / 1e6).toFixed(2) + ' MB';

  $('m-scale').textContent = fmt(state.scale, 2) + '\u00d7';
  // The pixel count is the number a frame cost actually correlates with, so it belongs on the panel
  // next to the frame time. `canvas` alone hid the budget: it showed the buffer size without ever
  // saying "this is NOT your screen's resolution".
  // THE CLAUSE IS PRINTED, not implied. The panel used to show the buffer size and a bare ", capped",
  // which told a reader that SOMETHING had capped it but not what — so the one number R2 is judged
  // against was the one number not on the panel. It is shown as "in clause" / "over" here, and
  // `tools/check-pixel-budget.mjs` recomputes the derivation so the printed clause cannot drift from
  // the measurement it comes from.
  const mpx = canvas.width * canvas.height / 1e6;
  const capped = mpx >= MAX_PIXELS / 1e6 * 0.999;
  $('m-canvas').textContent = canvas.width + '\u00d7' + canvas.height + '  (' + mpx.toFixed(2) + ' Mpx' +
    (capped ? ' at clause ' : ', clause ') + CLAUSE_MPX.toFixed(2) + ')';

  const settled = performance.now() - state.lastInput > 250;
  const idleOk = settled && bench.submitSamples.length === 0 && bench.framesDrawn === bench.framesAtIdleCheck;
  // R2 asks about the settled state. The settled state's cost is the BLIT, not the shade - which is
  // exactly the distinction the ablation numbers forced: a full shade is 49 ms and unreachable, a
  // blit is one texture read and is the thing R2 was always talking about.
  // ONLY a GPU measurement may become an R2 verdict. `cache.lastBlitMs` is CPU submit time measured
  // around drawArrays, which on a tile-based GPU says nothing about when the work completed - and
  // using it here is exactly the "submit time wearing a frame-time label" error this instrument has
  // been fixed for twice already. If there is no GPU number, R2 says so instead of guessing.
  const staticCost = Number.isFinite(bench.blitMs) ? bench.blitMs : NaN;
  const r2 = $('m-r2');
  if (!settled) {
    r2.textContent = 'settling…'; r2.className = 'muted';
  } else if (idleOk) {
    // Zero draws. The strictest possible pass: nothing is spent at all.
    r2.textContent = '0 draws when idle';
    r2.className = 'pass';
  } else if (Number.isFinite(bench.gpuBlitMs)) {
    // The real number: GPU-side blit cost, immune to presentation.
    const ok = bench.gpuBlitMs < 1.5;
    r2.textContent = fmt(bench.gpuBlitMs, 2) + ' ms gpu ' +
      (blitSupported ? 'blit ' : 'texture read ') + (ok ? '< 1.5' : '> 1.5');
    r2.className = ok ? 'pass' : 'fail';
  } else if (Number.isFinite(bench.directBlitMs)) {
    // ONE FRAME, MEASURED. This is claim 4's missing quantity, so it is reported ahead of the bound.
    // The caveat is on the row rather than in a report: the blit is into an offscreen target, so it
    // excludes presentation. Saying "direct" without that would be trading one overclaim for another.
    const ok = bench.directBlitMs < 1.5;
    // One decimal, because one decimal is what a 4 ms-bound clock supports after the floor is
    // subtracted. Two would be inventing resolution at the limit of the instrument.
    // One tenth, and never a negative zero. `Math.max(0, ...)` upstream means the smallest figure this
    // row can show is "~0.0", which is the honest render of "at or below the method's floor".
    r2.textContent = '~' + Math.max(0, bench.directBlitMs).toFixed(1) + ' ms frame ' +
      (ok ? '< 1.5' : '> 1.5');
    r2.className = 'warn';   // a latency derived by subtraction is evidence, not a settled verdict
  } else if (Number.isFinite(bench.blitUpperMs)) {
    // An upper bound is the strongest statement this device supports. If it clears the budget, the real
    // cost cannot fail; if it does not, that is inconclusive rather than a failure, and the wording says
    // which. Reporting the 5.00 ms vsync interval instead would be reporting the display.
    const clear = bench.blitUpperMs < 1.5;
    // Below 0.01 ms, two decimal places prints "0.00", which reads as "not measured" rather than as
    // "too fast to resolve". Say the smaller thing instead of a zero.
    const shown = bench.blitUpperMs < 0.01 ? '< 0.01' : fmt(bench.blitUpperMs, 2);
    // No leading "≤" when the number is already a bound: "≤ < 0.01" says the same thing twice.
    // Kept short enough for ONE line. The wording is unchanged where it carries meaning -- "upper
    // bound" is what makes the number readable as a bound rather than a measurement, and
    // `tools/check-cache.mjs` asserts the phrase is there. What was dropped is the parenthetical
    // "(real cost is lower)", which pushed the row onto two visual lines and is the report's job to
    // say, not a 340-px panel's.
    // THIS IS A THROUGHPUT FIGURE, NOT A FRAME COST, and the row says so.
    //
    // K blits over T ms gives T/K: the rate at which this GPU can retire blits when they are queued
    // back to back. That is a real and useful number, but it is a bound on THROUGHPUT, and a pipelined
    // GPU answers it with a smaller number than the latency of any single frame. Measured here: the
    // T/K figure is 0.014 ms while one fenced frame is 0.2 ms. Both are right; they answer different
    // questions. R2 asks for the cost of ONE frame, so calling T/K a frame-cost bound overstated what
    // it had measured -- the same class of error as calling submit time a frame time.
    r2.textContent = (bench.blitUpperMs < 0.01 ? '' : '\u2264 ') + shown + ' ms per frame k=64' +
      (clear ? ' < 1.5' : ' > 1.5');
    r2.className = clear ? 'pass' : 'warn';
  } else if (bench.directBlitReason && Number.isFinite(bench.blitUpperMs)) {
    // There is a bound but no direct measurement, and the reason is a fact about this device worth
    // showing: a reader seeing only "upper bound" cannot tell whether the direct number was tried.
    r2.textContent = 'bound only: ' + bench.directBlitReason.slice(0, 34);
    r2.className = 'warn';
  } else if (bench.gpuTimerState === 'no-samples') {
    // The timer exists but handed back nothing. Say so plainly: this is an instrument problem, and
    // calling the finish() number below "vsync-bound" would be inventing a cause for it.
    r2.textContent = 'GPU timer returned no samples';
    r2.className = 'warn';
  } else if (Number.isFinite(staticCost) && staticCost > 0) {
    // No timer query, so all we have is a finish() interval — which on a phone is the refresh
    // period. Reporting it as a pass or a fail would be answering a different question, so it is
    // reported as what it is and neither colour is claimed. A zero here means the backend did not
    // wait at all, which is not a refresh period either, hence the > 0 guard.
    r2.textContent = fmt(staticCost, 2) + ' ms vsync-bound, no GPU timer';
    r2.className = 'warn';
  } else if (Number.isFinite(staticCost)) {
    r2.textContent = fmt(staticCost, 2) + ' ms with no GPU timer (not a measurement)';
    r2.className = 'warn';
  } else {
    r2.textContent = 'press measure';
    r2.className = 'warn';
  }

  const r3 = $('m-r3');
  const ok3 = Number.isFinite(bpp) && bpp <= 32;
  r3.textContent = fmt(bpp, 1) + ' / 32';
  r3.className = ok3 ? 'pass' : 'fail';

  $('m-r1').textContent = 'pass (no image files)';
  $('m-r1').className = 'pass';
}

// 10 Hz, not 60: on a phone the DOM work in updateHud() is itself measurable, and an instrument that
// costs more than the thing it measures is not an instrument. The panel note says so rather than
// hiding it, because on a Kirin 710 the difference between "GPU idles" and "nothing runs at all" is
// exactly the sort of thing a HUD can fake.
setInterval(updateHud, 100);

// ---------------------------------------------------------------------------------------------
// input — every interaction invalidates exactly once
// ---------------------------------------------------------------------------------------------

const note = $('note');

canvas.addEventListener('pointermove', (e) => {
  // A small camera nudge, so "input" is not a fiction: this genuinely changes the image.
  const k = 0.0016;
  sunDir[0] = Math.cos(SUN_ELEVATION) * Math.cos(SUN_AZIMUTH) + e.clientX * k * 0.02;
  sunDir[1] = Math.sin(SUN_ELEVATION) + e.clientY * k * 0.02;
  // sunDir is recomputed per frame from the sun's declination (see sunDirection()).
  state.lastInput = performance.now();
  bench.submitSamples.length = 0;   // a new burst: previous frames are not this state
  requestFrame();
});

let dragging = false;
canvas.addEventListener('pointerdown', () => { dragging = true; state.lastInput = performance.now(); });
canvas.addEventListener('pointerup',   () => { dragging = false; state.lastInput = performance.now(); });

// The shadow is 65% of the frame, so these two controls are the only affordable quality levers on a
// phone whose entire budget is 45% flat-fill. Switching either MUST invalidate the cache or it will
// silently do nothing - which is the failure mode this file has already been bitten by.
document.querySelectorAll('#taps button').forEach((btn) => {
  btn.addEventListener('click', () => {
    state.shadowTaps = Number(btn.dataset.taps);
    document.querySelectorAll('#taps button').forEach((b2) => b2.classList.toggle('on', b2 === btn));
    $('m-taps').textContent = state.shadowTaps;
    requestFrame();
  });
});

document.querySelectorAll('#simple button').forEach((btn) => {
  btn.addEventListener('click', () => {
    state.simpleGeometry = Number(btn.dataset.simple);
    document.querySelectorAll('#simple button').forEach((b2) => b2.classList.toggle('on', b2 === btn));
    $('m-simple').textContent = state.simpleGeometry ? 'simple' : 'full';
    requestFrame();
  });
});

document.querySelectorAll('#exposures button').forEach((btn) => {
  btn.addEventListener('click', () => {
    state.exposure = Number(btn.dataset.ev);
    document.querySelectorAll('#exposures button').forEach((b) => b.classList.toggle('on', b === btn));
    $('m-exposure').textContent = state.exposure.toFixed(2);
    requestFrame();
  });
});

document.querySelectorAll('#scales button').forEach((btn) => {
  btn.addEventListener('click', () => {
    state.scale = Number(btn.dataset.scale);
    document.querySelectorAll('#scales button').forEach((b) => b.classList.toggle('on', b === btn));
    resize();                       // sets needsFrame when the buffer size actually changes
    requestFrame();                 // and always redraw once, so the change is visible immediately
  });
});

// Named rather than inlined in the click handler, because a capture needs the same work done before it
// photographs the panel. Two copies of this would drift, and the copy that drifts is always the one
// nobody is looking at.
function applyMeasurement(r) {
  const note = $('measure-note');
  // The old text claimed every sample included a gl.finish(). That is true only of the fallback path:
  // when the timer query works, the numbers are GPU-side intervals with no stall in them at all. The
  // note now says which, because a note that misdescribes its own instrument is worse than no note.
  // HOW MANY OF THE SAMPLES THE DRIVER ACTUALLY REPORTED. Twelve are asked for; a driver that warms up
  // its timing pipeline late may return only the last few, and a median of three is a different claim
  // from a median of twelve. Measured here: queries issued in the first ~1.5 s of the timing pipeline's
  // life stay ``unavailable forever, so this is a real and recurring outcome rather than a corner case.
  const d = bench.gpuQueryDiag || {};
  const got = d.kept ?? r.samples;
  const how =
    bench.gpuTimerState === 'ok'
      ? 'median of ' + got + ' of ' + (d.issued ?? r.samples) + ' samples the GPU timer reported' +
        (got < 6 ? ' -- FEW, so treat this as indicative rather than settled' :
                   '; timed on the GPU, so the frame loop never stalls')
      : bench.gpuTimerState === 'no-samples'
        ? 'GPU timer returned nothing (' + (d.issued ?? 0) + ' issued, ' + (d.ready ?? 0) +
          ' ready); these are gl.finish() intervals, not GPU cost.'
        : 'no GPU timer in this browser; these are gl.finish() intervals, which on a phone are the ' +
          'refresh period rather than GPU cost.';
  note.textContent =
    'SHADE ' + r.shade.toFixed(2) + ' ms (p95 ' + r.shadeP95.toFixed(2) + ')  -  only when something changes\n' +
    'BLIT  ' + r.blit.toFixed(2) + ' ms (p95 ' + r.blitP95.toFixed(2) + ')  -  the per-frame cost of a static scene\n' +
    how;
  note.style.whiteSpace = 'pre-wrap';
  updateHud();                        // so a capture taken right now shows the new numbers, not the old
  requestFrame();
}

// THE CURTAIN. One boolean in, four numbers out of the thermal network, one picture.
//
// This is the whole of claim 2 in one control, and it is deliberately not a brightness slider: the
// solver decides what the window passes, the shader multiplies its sun radiance by that fraction, and
// the panel reports the watts the AC draws so the two can be compared. `refreshRoom()` runs on the
// change, not per frame -- the network is a pure function of one boolean.
$('curtain').addEventListener('click', () => {
  setCurtain(!roomState.curtain);
  $('curtain').textContent = roomState.curtain ? 'open the curtain' : 'close the curtain';
  $('curtain').classList.toggle('on', roomState.curtain);
  updateHud();
});

$('measure').addEventListener('click', async () => {
  // `measureFrame` is async now: it yields frames waiting for the timer queries to report. Handing its
  // Promise straight to `applyMeasurement` would have put `undefined` into every HUD field, which reads
  // as "not measured" and would have been blamed on the device.
  const btn = $('measure');
  btn.disabled = true;
  $('measure-note').textContent = 'measuring\u2026';
  try {
    applyMeasurement(await measureFrame(12));
  } finally {
    btn.disabled = false;
  }
});

// The phone half of the capture path. There is no cable and no remote debugger on the device whose
// picture actually matters, so the page has to hand the frame over itself. A data URL in an <a download>
// works in Firefox for Android and Chrome without a permission prompt, and the file lands in Downloads
// where it can be attached to a message.
$('snap').addEventListener('click', async () => {
  const note = $('snap-note');
  note.textContent = 'capturing...';
  try {
    const r = await window.__odderon.capturePicture();
    const a = document.createElement('a');
    a.href = r.png;
    a.download = 'odderon-' + Date.now() + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    note.textContent =
      r.width + ' x ' + r.height + ' saved' + (r.hud ? ' with panel' : ' (panel overlay failed, scene only)') +
      '. If nothing was saved, long-press the image link below.';
    if (!r.hud) {
      // The fallback that still gets the picture to a person when the download is blocked.
      const img = new Image();
      img.src = r.png;
      img.style.cssText = 'max-width:100%;margin-top:6px;border:1px solid #30404f';
      note.appendChild(img);
    }
  } catch (e) {
    note.textContent = 'capture failed: ' + String(e && e.message ? e.message : e);
  }
});

$('toggle').addEventListener('click', () => {
  const hud = $('hud');
  const hidden = hud.classList.toggle('hidden');
  $('toggle').textContent = hidden ? 'show' : 'hide';
});

// ---------------------------------------------------------------------------------------------
// boot
// ---------------------------------------------------------------------------------------------

const renderer = (() => {
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : 'unknown';
})();
// Also on `bench`, because the picture is only worth something if the GPU behind it is named. A capture
// from a software rasteriser and one from a phone GPU are different evidence, and the stamp has to say
// which it is or the number beside it is unattributable.
bench.renderer = renderer;

note.innerHTML =
  'renderer: <span style="color:#8fa0b3">' + renderer + '</span><br>' +
  'Tap or drag the canvas to force frames.<br>' +
  'Stop, wait 250 ms: draws must stop.';

resize();
state.lastInput = performance.now();
requestFrame();

// A finite burst on load, so there is a measurement on screen even if the user never touches anything.
//
// Bounded by WALL CLOCK, not by frame count, and that distinction is load-bearing. A count of 40
// frames is 0.7 s on a real GPU and 10 s on a software rasteriser, so a frame-counted burst makes the
// "settled" moment depend on how fast the machine is — which is exactly the thing being measured. A
// time-bounded burst is a fixed claim ("this many milliseconds of work, then stop") on every machine.
//
// Note also the shape: one rAF chain of known length. An earlier version re-armed itself through a
// nested rAF+setTimeout, which kept drawing after the burst was over; the idle check caught it.
const BURST_MS = 400;
const burstStart = performance.now();
function burst() {
  state.lastInput = performance.now();
  requestFrame();
  if (performance.now() - burstStart < BURST_MS) requestAnimationFrame(burst);
}
requestAnimationFrame(burst);

// Load the propagation kernel before the first burst, so the first frame has a real orbit. The burst
// above is harmless without it -- `drawFrame` returns early -- but starting the fetch here means the page
// is drawing the real orbit as soon as the bytes arrive rather than on the first interaction.
loadKernel().then(() => {
  // The room, from the same kernel, on the same event. If the module failed to load this records
  // `unavailable` and the pane renders cold -- it does not invent a temperature, for the same reason
  // the orbit does not invent an ellipse.
  setCurtain(roomState.curtain);
  updateHud();
  // Say which orbit is on screen. "wasm" means the kernel's own numbers; anything else is a named
  // failure rather than an orbit drawn by something else. A page that draws an ellipse without saying
  // where the ellipse came from is the defect this whole change exists to remove.
  // The row shows a SHORT value, and the reason goes on the note line underneath. That split is not
  // cosmetic: the HUD is rasterised into the saved PNG through an SVG <foreignObject>, which lays text
  // out without honouring the flex row's wrapping, so a long value collides with its own label in the
  // picture even though the live DOM renders it correctly. A screenshot is the artifact a person judges,
  // so the picture is what this has to survive -- `unavailable: Failed to fetch` printed straight through
  // "orbit source".
  const el = document.getElementById('m-orbit');
  if (el) {
    el.textContent = kernelState.module ? 'wasm kernel' : 'unavailable';
    el.classList.toggle('fail', !kernelState.module);
  }
  if (!kernelState.module && kernelState.lastError) {
    const note = document.getElementById('note');
    // Set the `muted` class explicitly rather than relying on it: before the kernel resolves this
    // element is empty AND unstyled, so the SVG rasteriser used for the saved PNG lays it out as
    // full-size text and it overlaps the provenance stamp line. An empty styled element collapses.
    if (note) {
      note.className = 'muted';
      note.textContent = 'orbit source ' + kernelState.status;
    }
  }
  requestFrame();
});

// A capture hook for tools/check-shell.mjs. `preserveDrawingBuffer` is false (it costs bandwidth and
// this renderer is about bandwidth), so a canvas readback *outside* a draw returns an empty buffer.
// The only honest way to sample the image is from inside the frame that drew it, so a request sets a
// flag and the next draw fills it. This changes nothing when nobody asks.
const captureReq = { want: false, out: null };

// A *picture* request, as distinct from the pixel probe above. `page.screenshot()` cannot be used for
// this: `preserveDrawingBuffer` is false, so the canvas is cleared as soon as the frame is composited,
// and what a headless capture returns is whatever the compositor happened to hold -- often blank, and
// never something this code can promise is the frame it drew. So the same in-frame rule applies:
// ask, then read the buffer from inside the next draw.
//
// The HUD is composited in deliberately. The whole point is that a person looking at the image can see
// WHICH settings produced it -- render scale, taps, geometry. A picture of the scene with no
// provenance is a picture that cannot be argued with, and this project does not get to show numbers
// next to a frame that might not correspond to them.
//
// The HUD is HTML, not WebGL, so it cannot be read back by gl.readPixels. It is rasterised instead
// through an SVG <foreignObject>, which is the one way to draw live DOM into a canvas with no
// dependencies. If that throws (some browsers refuse to rasterise an <img> from foreignObject), the
// capture is still valid and `hud` is reported as false -- an absent panel is a smaller lie than a
// panel that says it captured something it did not.
//
// THE STYLESHEET HAS TO BE CARRIED IN, and it was not. `XMLSerializer` serialises `#hud` and nothing
// else, and every rule that makes the panel readable lives in the document's <style> block, which is
// not inside `#hud`. So the SVG was rasterised with NO CSS at all: the flex rows collapsed into one
// unstyled run of text, and the saved PNG showed values printed on top of their own labels
// ("R2 idle < 1.5 m5 ms gpu blit < 1.5"). The live page was always correct, which is exactly why this
// survived -- every check looked at the page, and the page was fine. The artifact a person actually
// judges was the broken one. The stylesheet is now inlined into the SVG, so the panel in the picture is
// the panel on the screen.
const pictureReq = { want: false, resolve: null };

/**
 * The document's own CSS, for embedding in the rasterised HUD.
 *
 * Read from the live stylesheet rather than restated as a string: a second copy of the panel's styling
 * would drift from the first, and the drift would be invisible for the same reason the original bug was.
 *
 * The `@font-face` / `@import` rules are dropped because an SVG loaded from a `data:` URL cannot fetch
 * anything -- leaving them in would make the image request fail outright rather than render unstyled.
 */
function hudStylesheet() {
  const escapeXml = (t) =>
    t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let css = '';
  for (const sheet of document.styleSheets) {
    let rules;
    try {
      rules = sheet.cssRules;                 // throws for a cross-origin sheet; ours is inline
    } catch {
      continue;
    }
    for (const rule of rules) {
      if (rule.type === CSSRule.STYLE_RULE || rule.type === CSSRule.MEDIA_RULE) {
        css += rule.cssText + '\n';
      }
    }
  }
  return css ? '<style>' + escapeXml(css) + '</style>' : '';
}

async function capturePicture() {
  // Force a draw: render-on-demand means nothing is coming on its own.
  requestFrame();
  const raw = await new Promise((res) => { pictureReq.want = true; pictureReq.resolve = res; });

  const out = document.createElement('canvas');
  out.width = raw.width;
  out.height = raw.height;
  const ctx = out.getContext('2d');
  ctx.drawImage(raw, 0, 0);

  // Everything that decides what the image looks like, stamped as text rather than left to memory.
  const stamp = [
    'odderon ' + new Date().toISOString(),
    'canvas ' + raw.width + ' x ' + raw.height + ' (' + (raw.width * raw.height / 1e6).toFixed(2) + ' Mpx)',
    'scale ' + state.scale.toFixed(2) + '  taps ' + state.shadowTaps + '  ' +
      (state.simpleGeometry ? 'simple' : 'full') + ' geometry',
    'renderer ' + (bench.renderer || 'unknown'),
    'R2 ' + ($('m-r2')?.textContent ?? '-') + '   R3 ' + ($('m-r3')?.textContent ?? '-'),
    'gpu timer ' + (bench.gpuTimerState || '-') +
      (Number.isFinite(bench.gpuBlitMs) ? '  ' + bench.gpuBlitMs.toFixed(3) + ' ms' : ''),
  ];
  // The stamp is scaled with the frame for the same reason the panel is: fixed 12 px text in a 729-px-wide
  // buffer is a caption nobody can read. `stampScale` converts the CSS-pixel sizes below into buffer
  // pixels, and is clamped at 1 so a capped drawing buffer (which can be SMALLER than the viewport) does
  // not render the text below its intended size.
  const stampScale = Math.max(1, raw.width / window.innerWidth);
  ctx.font = (12 * stampScale) + 'px ui-monospace,Menlo,monospace';
  const lines = stamp.map((t) => t.replace(/\s+/g, ' ').slice(0, 96));
  const pad = 8 * stampScale;
  const lineH = 16 * stampScale;
  const boxH = lines.length * lineH + pad * 2;
  ctx.fillStyle = 'rgba(10,12,15,.86)';
  ctx.fillRect(0, out.height - boxH, out.width, boxH);
  ctx.fillStyle = '#9fb0c0';
  lines.forEach((t, i) => ctx.fillText(t, pad, out.height - boxH + pad + lineH * (i + 1) - 4));

  // THE PANEL IS COMPOSITED LAST, because on the page `#hud` carries z-index 10 and therefore sits on
  // top of everything. This block used to run BEFORE the provenance stamp was painted, so the stamp's
  // box covered the bottom of the panel -- on a 700 px window, the last four rows outright. Painting
  // order is now the stacking order a person actually sees.
  let hud = false;
  const panel = $('hud');
  if (panel) {
    try {
      const r = panel.getBoundingClientRect();
      const html = new XMLSerializer().serializeToString(panel);
      // The wrapper reproduces what `position: fixed; top/left` did on the page, because the SVG is its
      // own coordinate space: the panel's offsets are meaningless there, and the dropped `fixed`
      // positioning would otherwise let it lay out at whatever the rasteriser chose.
      //
      // THE WIDTH IS PINNED TO THE MEASURED WIDTH, and that is load-bearing. `max-width` is what
      // constrains the panel on the page; relaxed inside the SVG the panel reflowed into a different,
      // ultimately TALLER layout, and since the SVG's height was still the height measured on the page,
      // the bottom of the panel was silently cropped -- `R1` and `orbit source` disappeared. Pinning the
      // width makes the raster use the layout that was measured, so the picture matches the page.
      const w = Math.ceil(r.width);
      const h = Math.ceil(r.height);
      const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
        '<foreignObject x="0" y="0" width="100%" height="100%">' +
        // The base font, colour and line-height come from `body` on the page and are INHERITED by the
        // panel. An SVG document has no `body`, so without this the inherited rules are lost and every
        // element that does not set its own font -- the buttons, which only set colour and background --
        // falls back to the rasteriser's default: 16 px sans-serif. That is why the buttons in the saved
        // picture were larger than their own row labels while the live page was correct. `!important`
        // because the inlined stylesheet's `html, body` rules would otherwise apply to nothing here.
        '<div xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;' +
        'font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cfd6de;">' +
        hudStylesheet() +
        // The panel is drawn OPAQUE in the still, and this is the one place the picture deliberately
        // differs from the screen. Its background is `rgba(10,12,15,.82)`, so in the capture the
        // provenance stamp painted underneath showed through it and made the bottom rows unreadable --
        // a blurrier version of the very defect this change fixes. `backdrop-filter` does not survive
        // into an SVG raster either, so the panel cannot reproduce its on-screen translucency here
        // regardless; given that, opaque is the honest choice. What is lost is exactly "you can see the
        // scene through the panel", and that is stated rather than hidden.
        '<style>#hud{position:static !important;margin:0 !important;top:auto !important;' +
        'left:auto !important;width:' + w + 'px !important;max-width:none !important;' +
        'background:rgb(10,12,15) !important;backdrop-filter:none !important;' +
        'box-sizing:border-box !important;}</style>' +
        html + '</div></foreignObject></svg>';
      const img = new Image();
      await new Promise((res, rej) => {
        img.onload = res;
        img.onerror = rej;
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      });
      // CSS PIXELS ARE NOT IMAGE PIXELS, and the panel was composited as if they were.
      //
      // `getBoundingClientRect()` reports CSS pixels. The canvas being written to is the DRAWING BUFFER,
      // which on a phone is 729x1578 for a 390x844 viewport. Drawing the panel at `r.left, r.top` with
      // `w x h` therefore placed a 390-px-wide panel into a 729-px-wide image: the panel appeared at
      // rather more than half size, in the top-left corner, over a scene scaled to fit the full frame.
      // The live page was always right, which is again why this survived -- and it only appears above
      // dpr 1, so the desktop captures that every check used could not see it.
      //
      // The scale is derived from the frame that was captured rather than read from `devicePixelRatio`,
      // because `state.scale` and the MAX_PIXELS cap both alter the drawing buffer independently of the
      // device's ratio. The frame is what the panel has to fit.
      const scale = raw.width / window.innerWidth;
      ctx.save();
      ctx.scale(scale, scale);
      ctx.drawImage(img, r.left, r.top);
      ctx.restore();
      hud = true;
    } catch {
      hud = false;                              // the frame is still real; only the overlay is missing
    }
  }

  return { canvas: out, hud, stamp: lines };
}
// The debug surface. `cache` is exported because the cache is now the thing that can be WRONG in a
// way that looks perfect: a stale cache renders a beautiful, plausible, frozen image. Anything that
// must be checked from outside - was a full shade taken, did the contents change - has to be visible
// here, or the only way to find out is to look at the picture and guess.
window.__odderon = {
  state, bench, gl, cache,
  // The room, so a test can ask whether the picture is reading the kernel rather than a constant.
  // `tools/check-room.mjs` compares these against the module's own exports and against the panel.
  roomState,
  // The orbit boundary, exposed so `tools/check-orbit.mjs` can run the real module in a real page and
  // so a person with a phone can ask the page what it thinks the orbit is. Reading `kernelState.status`
  // is the honest answer to "is this the kernel or is it nothing".
  kernel: kernelState,
  orbitPosition,
  orbitVelocity,
  orbitDiag,
  renderer: () => renderer,
  requestFrame,
  /**
   * Ask for a PNG data URL of the current frame, HUD and provenance stamp included.
   *
   * It measures first, unless told not to. A capture is the artifact somebody looks at to judge claim
   * 5, and shipping one whose panel reads "press measure" means the numbers are missing exactly when
   * they are wanted. Measuring costs one burst of frames and changes nothing about what is on screen.
   */
  capturePicture: async ({ measure = true } = {}) => {
    if (measure && typeof measureFrame === 'function') {
      applyMeasurement(await measureFrame(12));   // async: waits for the GPU timer to report
    }
    const { canvas: c, hud, stamp } = await capturePicture();
    return { png: c.toDataURL('image/png'), hud, stamp, width: c.width, height: c.height };
  },
  requestCapture(size = 48) {
    captureReq.want = true;
    captureReq.size = size;
    // This must schedule a frame. Without it the promise waits for a draw that render-on-demand will
    // never perform - the page is idle by design, so nothing is coming. The first version of this
    // hook deadlocked for exactly that reason, and a deadlocked probe reads as a hung test rather
    // than as the bug it is.
    const p = new Promise((res) => { captureReq.resolve = res; });
    requestFrame();
    return p;
  },
  async capturePixels(size = 48) { return this.requestCapture(size); },
  // Exposed so a test can run the REAL measurement rather than a copy of it. A copy is what this
  // project keeps catching itself testing.
  measureFrame,
  blitFrame,      // the per-frame primitive, so a test measures the real one rather than a copy
  upperBoundBlit, // the no-GPU-timer estimate, so its honesty can be tested rather than trusted
  directBlitMs,   // the per-frame DIRECT measurement, for the same reason
  // Force the next frame down the expensive path, so a test can compare cached vs freshly shaded.
  invalidate() { cache.valid = false; },
};
</script>
</body>
</html>
