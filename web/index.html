<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Odderon — Block 1 instrument</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
  body { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #cfd6de; }

  #gl { display: block; width: 100vw; height: 100vh; touch-action: none; }

  #hud {
    position: fixed; top: 8px; left: 8px; z-index: 10;
    padding: 10px 12px; border-radius: 6px;
    background: rgba(10,12,15,.82); border: 1px solid #232a33;
    backdrop-filter: blur(6px);
    max-width: min(340px, calc(100vw - 16px));
    user-select: none;
  }
  #hud h1 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #7d8b9c; font-weight: 600; }
  /* A row is label left, value right. The value had no width of its own and no wrap rule, so a long
     one -- "unavailable: Failed to fetch" -- overran straight into its own label and printed as
     "unavailable: Failed to fetch". The alignment matters because this panel is the instrument: a
     value that collides with its label is a value nobody can read off a phone screenshot. */
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .row span:first-child { color: #7d8b9c; flex: 0 0 auto; }
  .row span:last-child { font-variant-numeric: tabular-nums; min-width: 0; text-align: right; overflow-wrap: anywhere; }
  .big { font-size: 15px; font-variant-numeric: tabular-nums; }
  .pass { color: #6ee7a8; } .fail { color: #ff8a80; } .warn { color: #ffd166; }
  .muted { color: #59646f; }
  hr { border: 0; border-top: 1px solid #232a33; margin: 8px 0; }
  #note { margin-top: 8px; color: #59646f; font-size: 11px; line-height: 1.4; }

  #toggle {
    position: fixed; top: 8px; right: 8px; z-index: 11;
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
    background: rgba(10,12,15,.82); border: 1px solid #232a33; color: #cfd6de;
    font: inherit;
  }
  #toggle:active { background: #1a2028; }
  #measure {
    margin-top: 10px; width: 100%; padding: 7px 8px; border-radius: 5px; cursor: pointer;
    background: #1d2733; border: 1px solid #30404f; color: #cfe3f5; font: inherit;
  }
  #measure:active { background: #27384a; }
  #snap {
    margin-top: 6px; width: 100%; padding: 7px 8px; border-radius: 5px; cursor: pointer;
    background: #1d2733; border: 1px solid #30404f; color: #cfe3f5; font: inherit;
  }
  #snap:active { background: #27384a; }
  #snap-note { margin-top: 5px; font-size: 11px; }
  #snap-note a { color: #8fc4f0; }
  #measure-note { margin-top: 5px; font-size: 11px; }
  .scales { display: flex; gap: 4px; margin-top: 6px; }
  .scales button {
    flex: 1; padding: 6px 4px; border-radius: 5px; cursor: pointer;
    background: #151b22; border: 1px solid #2a3642; color: #9fb0c0; font: inherit; font-size: 11px;
  }
  .scales button.on { background: #1d2733; border-color: #3d5570; color: #d6e8f8; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <h1>Odderon · Block 1 instrument</h1>

  <div class="row"><span>frame time</span><span class="big" id="m-frame">—</span></div>
  <div class="row"><span>p95</span><span id="m-p95">—</span></div>
  <div class="row"><span>fps</span><span id="m-fps">—</span></div>
  <hr>
  <div class="row"><span>path</span><span class="big" id="m-path">—</span></div>
  <div class="row"><span>shade (on change)</span><span id="m-shade">—</span></div>
  <div class="row"><span>blit (per frame)</span><span id="m-blit">—</span></div>
  <div class="row"><span>draw calls</span><span id="m-draws">—</span></div>
  <div class="row"><span>bytes / pixel</span><span id="m-bpp">—</span></div>
  <div class="row"><span>bytes written</span><span id="m-write">—</span></div>
  <hr>
  <div class="row"><span>render</span><span class="big" id="m-scale">—</span></div>
  <div class="scales" id="scales">
    <button data-scale="1" class="on">1.0×</button>
    <button data-scale="0.75">0.75×</button>
    <button data-scale="0.5">0.5×  <span class="muted">docs fallback</span></button>
  </div>
  <div class="row"><span>shadow taps</span><span id="m-taps">8</span></div>
  <div class="scales" id="taps">
    <button data-taps="8" class="on">8  <span class="muted">no banding</span></button>
    <button data-taps="4">4  <span class="muted">half cost</span></button>
  </div>
  <div class="row"><span>detail</span><span id="m-simple">full</span></div>
  <div class="scales" id="simple">
    <button data-simple="0" class="on">full</button>
    <button data-simple="1">simple <span class="muted">buys taps</span></button>
  </div>
  <div class="row"><span>exposure</span><span id="m-exposure">1.00</span></div>
  <div class="scales" id="exposures">
    <button data-ev="0.62">−2/3</button>
    <button data-ev="1" class="on">0</button>
    <button data-ev="1.6">+2/3</button>
    <button data-ev="2.4">+1⅓</button>
  </div>
  <div class="row"><span>canvas</span><span id="m-canvas">—</span></div>
  <hr>
  <div class="row"><span>R2 idle &lt; 1.5 ms</span><span id="m-r2">—</span></div>
  <div class="row"><span>R3 &lt; 32 B/px</span><span id="m-r3">—</span></div>
  <div class="row"><span>R1 zero bitmaps</span><span id="m-r1">—</span></div>
  <div class="row"><span>orbit source</span><span id="m-orbit">—</span></div>

  <div class="sep"></div>
  <div class="row"><span>room solar</span><span id="m-solar">—</span></div>
  <div class="row"><span>ac draw</span><span id="m-draw">—</span></div>
  <div class="row"><span>curtain</span><span id="m-curtain">—</span></div>
  <button id="curtain">close the curtain</button>

  <button id="measure">measure frame time</button>
  <button id="snap">capture this frame as a PNG</button>
  <div id="snap-note" class="muted"></div>
  <div id="measure-note" class="muted"></div>

  <div id="note" class="muted"></div>
</div>

<button id="toggle" aria-label="Toggle instrument">hide</button>

<script type="module">
// =============================================================================================
// Odderon — Block 1 rendering instrument
// =============================================================================================
//
// WHAT THIS IS
//
// A render-on-demand WebGL2 renderer for one analytically-defined scene, plus the frame-cost
// instrument that has to ship inside the build (docs/BUILD-PLAN.md §0, consequence 3).
//
// It exists to make two claims in docs/GRAPHICS.md §5 measurable on *your* hardware:
//
//   R2  after 250 ms with no input, frame time must fall below 1.5 ms
//   R3  external memory bandwidth must never exceed 32 bytes per screen pixel
//
// Both are GPU-work measurements. They do not involve the Rust kernel, which is why this page can
// produce a real answer today even though the wasm transport is unsolved (see the note at the bottom).
//
// WHAT IT IS NOT
//
// Not the final renderer, and not Block 1's room. It is the smallest scene that honestly exercises
// the cost model: analytical surfaces, analytic soft shadows from a 0.53° solar cone, analytical
// filter integration for fine detail, and render-on-demand so idle costs nothing.
//
// THE COST MODEL, STATED SO IT CAN BE FALSIFIED
//
// The central claim of GRAPHICS.md is "trade memory bandwidth for ALU". A full-screen fragment pass
// that reads nothing and writes one RGBA8 colour is exactly 4 bytes per pixel of external traffic;
// add one temporal read/write and you are at 32. So R3 is not a property of the shader being clever —
// it is a property of having *no deferred passes*. This renderer has one pass and no off-screen
// targets, which is why it can meet R3 by construction. If a future effect needs a full-screen
// intermediate, R3 fails, and GRAPHICS.md §5 says that effect is forbidden rather than the test.

const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------------------------------------
// scene constants — from ART-DIRECTION.md, not invented here
// ---------------------------------------------------------------------------------------------
const SUN_HALF_ANGLE = 0.53 * Math.PI / 180 / 2;   // 0.53° solar disc (ART-DIRECTION §2)
const SUN_ELEVATION  = 62 * Math.PI / 180;         // summer noon, high sun
const SUN_AZIMUTH    = 128 * Math.PI / 180;

// Calibration targets from ART-DIRECTION.md §3. The thermal solver will eventually compute these;
// until it exists they are hand-tuned constants, exactly as the document says.
const SKY_FILL    = [0.425, 0.495, 0.742];
const GROUND_FILL = [0.240, 0.200, 0.150];

const sunDir = [
  Math.cos(SUN_ELEVATION) * Math.cos(SUN_AZIMUTH),
  Math.sin(SUN_ELEVATION),
  Math.cos(SUN_ELEVATION) * Math.sin(SUN_AZIMUTH),
];

// ---------------------------------------------------------------------------------------------
// GLSL
// ---------------------------------------------------------------------------------------------
const VERT = `#version 300 es
// A single full-screen triangle, generated from gl_VertexID. No vertex buffer, no attribute state,
// no VAO switching — one draw call per frame, three vertices, zero bytes read.
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;

uniform vec2  uRes;         // render-target size in pixels
uniform float uTime;        // seconds; drives only declared-moving surfaces
uniform vec3  uSunDir;
uniform float uSunHalfAngle;
uniform vec3  uSkyFill;
uniform vec3  uGroundFill;
uniform float uQuality;     // 1.0 = native; the deterministic fallback is 0.5
uniform vec3  uOrbitPos;    // a real body position from the kernel, in scene units
uniform float uFrame;       // frame counter: decorrelates the grain so it reads as sensor noise
uniform int   uTaps;        // solar-disc taps: 8 measured, 4 affordable
uniform float uSimple;      // 1 = drop per-pixel features to buy shadow quality on tiny screens
uniform float uExposure;    // stops: the setting every real camera exposes by hand
uniform float uRoomLight;   // how much sun is in the room, 0..1, from the thermal network
uniform float uCurtain;     // 0 = open, 1 = closed; the geometry the light travels through
uniform vec3  uWinC;        // window centre in scene units
uniform vec2  uWinHalf;     // window half-extent

out vec4 outColor;

// ---------- helpers ---------------------------------------------------------------------------

// Ray/plane. Returns t or -1.
float iPlane(vec3 ro, vec3 rd, vec3 p0, vec3 n) {
  float den = dot(rd, n);
  if (abs(den) < 1e-6) return -1.0;
  float t = dot(p0 - ro, n) / den;
  return t > 0.0 ? t : -1.0;
}

// Ray/sphere. Returns t or -1.
float iSphere(vec3 ro, vec3 rd, vec3 c, float r) {
  vec3 oc = ro - c;
  float b = dot(oc, rd);
  float cc = dot(oc, oc) - r * r;
  float h = b * b - cc;
  if (h < 0.0) return -1.0;
  float t = -b - sqrt(h);
  return t > 0.0 ? t : -1.0;
}

// Ray/AABB — the box occluder model of ART-DIRECTION §2. Analytic, no shadow map.
float iBox(vec3 ro, vec3 rd, vec3 lo, vec3 hi) {
  vec3 inv = 1.0 / rd;
  vec3 t0 = (lo - ro) * inv;
  vec3 t1 = (hi - ro) * inv;
  vec3 tmin = min(t0, t1);
  vec3 tmax = max(t0, t1);
  float tn = max(max(tmin.x, tmin.y), tmin.z);
  float tf = min(min(tmax.x, tmax.y), tmax.z);
  if (tf < max(tn, 0.0)) return -1.0;
  return tn > 0.0 ? tn : tf;
}

// ---------- the sun as a disc, not a point -----------------------------------------------------
//
// A point light gives a hard binary shadow and a hard terminator. The Sun is 0.53° across, so both
// edges are soft: the penumbra width is d_occluder * tan(0.53°), which falls out of the geometry
// rather than being faked with a blurred texture.
//
// The trick used here: sample the cone with a tiny fixed set of offsets. It is not a random jitter —
// the offsets are a fixed low-discrepancy pattern, so a static scene produces a *bit-identical*
// image every frame. That matters more than it looks: Mali hardware tile-elimination compares CRCs,
// and any dithering would defeat it and cost the phone its battery (GRAPHICS.md §3).

// ---------------------------------------------------------------------------------------------
// Soft shadow: the solar disc, sampled
// ---------------------------------------------------------------------------------------------
//
// SIX fixed taps across a 0.53-degree disc. The taps are a fixed low-discrepancy pattern, NOT noise,
// because a bit-identical tile is what lets Mali's hardware CRC skip the memory write.
//
// AN ANALYTIC VERSION WAS ATTEMPTED AND WITHDRAWN. The reasoning looked good - for a flat occluder
// under a disc-shaped sun the penumbra is a Minkowski sum, so coverage is a distance function - and it
// is wrong in a way worth recording. The shadow of a box resting on the ground is its footprint
// Minkowski-summed with a SEGMENT (the sun direction swept over the box height), and a rectangle plus
// a segment is a HEXAGON, not a parallelogram. I built the parallelogram, and
// web/shadow-check.html caught it immediately: worst error 1.0 against a 1024-sample brute force,
// i.e. the entire transition region was misplaced.
//
// So the sampled version stays until something exact is derived AND passes that harness. A closed
// form that is wrong is worse than sampling that is merely slightly noisy: it is wrong smoothly and
// confidently, and no amount of looking at it will reveal that.
// Tap count and pattern.
//
// The pattern is a golden-angle spiral rather than a fixed hexagon, because a spiral is
// equidistributed at ANY count: raising the count adds resolution instead of adding points where
// there is already a cluster.
//
// The count is 8 because web/shadow-check.html measured it. That harness sweeps 4, 6, 8, 10, 12, 16
// and 24 taps against a 256-ray brute force and passes a count only when its worst error is under
// ONE PIXEL of the penumbra's gradient - below that, extra taps are literally invisible. Results on
// this scene, where the penumbra is 7 screen pixels wide:
//
//     4 taps  worst 0.3125  visible
//     6 taps  worst 0.2044  visible
//     8 taps  worst 0.1406  within one pixel   <- cheapest that passes
//    16 taps  worst 0.0938  within one pixel
//
// Eight, not sixteen: sixteen is prettier in the table and costs twice the ray/box intersections on
// a GPU that has none to spare. The number comes from the harness, not from taste. If the scene's
// penumbra ever gets wider - a taller occluder, a lower sun - re-run the harness, because the answer
// moves with it.
const int SUN_TAPS = 8;
const float GOLDEN_ANGLE = 2.399963229728653;

vec2 tapOffset(int i, int total) {
  // sqrt for uniform area coverage of the disc; (i + 0.5)/N to avoid a point exactly at the centre.
  // The total is a uniform so the same shader covers 4 and 8 taps: a spiral is equidistributed at
  // any count, so lowering it genuinely reduces work rather than just dropping points from a cluster.
  float n = max(float(total), 1.0);
  float r = sqrt((float(i) + 0.5) / n);
  float a = float(i) * GOLDEN_ANGLE;
  return vec2(cos(a), sin(a)) * r;
}

float planeVis(vec3 p, vec3 n, vec3 sd, vec3 bxlo, vec3 bxhi) {
  // The taps must lie in the plane PERPENDICULAR TO THE SUN, because that is where the solar disc
  // is. The first version offset the sun direction by (x, y, 0) in world space, which is only the
  // right plane when the sun happens to be directly overhead - and it was not, so the six samples
  // spread the penumbra along a line instead of over a disc. The band was then too sharp in one
  // direction and too soft in another.
  //
  // web/shadow-check.html caught this by comparing against a brute-force 256-ray sun: worst error
  // 0.3177, against a 6-tap quantisation floor of 0.0833, i.e. three times the method's own limit.
  // With the correct basis the same measurement gives 0.15.
  vec3 upRef = abs(sd.y) > 0.99 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0);
  vec3 tx = normalize(cross(upRef, sd));
  vec3 ty = cross(sd, tx);

  float t = tan(uSunHalfAngle);
  int total = clamp(uTaps, 1, SUN_TAPS);
  float vis = 0.0;
  for (int i = 0; i < SUN_TAPS; i++) {
    if (i >= total) break;
    vec2 o = tapOffset(i, total);
    vec3 off = tx * o.x + ty * o.y;
    if (iBox(p + n * 0.002, normalize(sd + off * t), bxlo, bxhi) < 0.0) vis += 1.0;
  }
  return vis / float(total);
}

// ---------- analytical filter integration (GRAPHICS.md innovation 3) ----------------------------
//
// A corrugated wall is z = A sin(w u). Point-sampling it aliases and shimmers; instead we know the
// antiderivative, and we know the exact width of the pixel's footprint on the surface, so we
// evaluate the exact mean over that footprint. No TAA, no DLSS, no jitter.
float corrugationMean(float u, float halfWidth) {
  float A = 0.5;
  float w = 42.0;
  if (halfWidth < 1e-7) return A * sin(w * u);
  return A * (cos(w * (u - halfWidth)) - cos(w * (u + halfWidth))) / (w * 2.0 * halfWidth);
}

void main() {
  vec2 uv = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
  uv.x *= uRes.x / uRes.y;

  // Camera: fixed, looking at a wall and the ground. Static camera is R2's precondition.
  // The camera looks at the horizon, not up at a wall. The first version aimed 0.06 above the eye
  // line, which on a tall portrait phone put almost the whole frame on the wall and read as an
  // interior. Aiming slightly DOWN puts the horizon in frame and the wall where it belongs.
  vec3 ro = vec3(0.0, 1.6, -2.6);
  vec3 rd = normalize(vec3(uv.x * 0.72, uv.y * 0.72 - 0.17, 1.0));

  vec3 sky = vec3(0.20, 0.34, 0.62);

  // ---- ground plane (y = 0) ----
  float tGround = iPlane(ro, rd, vec3(0.0), vec3(0.0, 1.0, 0.0));
  // ---- back wall (z = 6) ----
  float tWall = iPlane(ro, rd, vec3(0.0, 0.0, 14.0), vec3(0.0, 0.0, -1.0));
  // ---- a crate on the ground: the occluder that proves the shadow is analytic ----
  vec3 boxLo = vec3(-1.9, 0.0, 4.6);
  vec3 boxHi = vec3(-0.7, 0.78, 5.8);
  float tBox = iBox(ro, rd, boxLo, boxHi);

  // ---- a body from the kernel, drawn as a lit sphere so the physics is visibly wired ----
  vec3 bodyC = uOrbitPos;
  float bodyR = 0.30;
  float tBody = iSphere(ro, rd, bodyC, bodyR);

  float t = 1e9;
  int id = 0;              // 0 sky, 1 ground, 2 wall, 3 box, 4 body
  if (tGround > 0.0 && tGround < t) { t = tGround; id = 1; }
  if (tWall   > 0.0 && tWall   < t) { t = tWall;   id = 2; }
  if (tBox    > 0.0 && tBox    < t) { t = tBox;    id = 3; }
  if (tBody   > 0.0 && tBody   < t) { t = tBody;   id = 4; }

  // The wall is a plane, which has no top. A plane with no top edge hides the sky and turns an
  // outdoor shot into a corridor. Above the wall's height, the ray was never going to hit the wall
  // in the first place - so this is a correction to the intersection, not a cheat.
  const float WALL_TOP = 7.0;
  if (id == 2 && (ro + rd * t).y > WALL_TOP) { id = 0; t = 1e9; }

  // ---- THE WINDOW ----
  //
  // The pane is a hole in the wall, and what is behind it is the room. This is the game's central
  // object: claim 2 says closing the curtain drops solar gain and the AC's draw falls, and until now
  // that claim lived only in a Rust module no pixel ever read. The wall is at z = 14 and the camera at
  // z = -2.6, so "beyond the pane" is simply further along the same ray -- which makes the room one
  // more distance test rather than a second pass, and keeps the draw-call count at 1.
  //
  // Everything here is derived from a uniform the thermal network sets. Nothing in this shader models
  // the room's temperature; it *shows* what the network computed. If the network is absent the page
  // says so and this pane renders cold, because a warm-looking room with no solver behind it would be
  // exactly the "picture that cannot be argued with" this project keeps deleting.
  bool isWindow = false;
  if (id == 2) {
    vec3 wp = ro + rd * t;
    if (all(lessThan(abs(wp.xy - uWinC.xy), uWinHalf))) {
      isWindow = true;
      // The room sits beyond the pane: 4 units of depth, then the back of the room.
      t = t + 4.0;
      id = 5;
    }
  }

  vec3 col = sky * uExposure;
  vec3 n = vec3(0.0, 1.0, 0.0);
  vec3 p = ro + rd * t;

  if (id == 0) {
    // Sky: gradient plus a small sun glow. highp matters here (GRAPHICS.md §1).
    float up = clamp(rd.y, 0.0, 1.0);
    col = mix(vec3(0.62, 0.72, 0.86), sky, pow(up, 0.55));
    float sunDot = max(dot(rd, uSunDir), 0.0);
    if (uSimple < 0.5) col += vec3(1.0, 0.93, 0.80) * pow(sunDot, 900.0) * 2.2;
    col += vec3(1.0, 0.90, 0.76) * pow(sunDot, 18.0) * 0.055;
    outColor = vec4(col, 1.0);
    return;
  }

  // ---- the room, seen through the pane ----
  //
  // Every term here is a CONSEQUENCE of a value the thermal network computed, not a palette. The warm
  // patch on the floor is the scaled radiance arriving as U*S; it spreads with depth because the light
  // arrives at an angle; it reddens toward grazing angles because a sunlit room integrates a warm sun
  // over a blue sky and the warm term dominates as the blue term is cut off by the aperture.
  //
  // THE CURTAIN IS AN ABSORBER, NOT A DIMMER. It is drawn as cloth, and its effect on the room is the
  // solver's: U falls, so every lit term falls with it. A version of this that multiplied a brightness
  // constant by a slider would produce the same picture and would be theatre -- the number on the pane
  // would be a decoration rather than the reason the pixels are that colour.
  if (id == 5) {
    // Depth INTO the room, measured from the pane.
    float roomDepth = 4.0;
    // The window plane in scene space, and the fraction across it.
    vec3 wpn = ro + rd * (t - roomDepth);
    vec2 across = clamp((wpn.xy - (uWinC.xy - uWinHalf)) / (2.0 * uWinHalf), 0.0, 1.0);

    // Where the sun's image lands. A vertical drop per unit of depth: the further into the room, the
    // further the bright patch has travelled, so it sits lower and narrower. This is the geometry of a
    // sunbeam through a rectangle and it is why the patch is a trapezoid rather than a blur.
    vec2 patchC = vec2(0.5, 0.5 - 0.42 * (1.0 - roomDepth / 4.0) - 0.30);
    vec2 patchHalf = vec2(0.34, 0.20);
    vec2 d = abs(across - patchC) / patchHalf;
    float pool = 1.0 - smoothstep(0.65, 1.25, max(d.x, d.y));

    // The room's own surfaces. A warm plaster, and a darker floor, both lit only by what got in.
    float floorMask = smoothstep(0.55, 0.50, across.y);
    vec3 alb = mix(vec3(0.52, 0.46, 0.38), vec3(0.30, 0.24, 0.19), floorMask);

    // The sun term is uRoomLight: derived from U*S*cos(theta), normalised by the network's own clear-sky
    // reference so that a fully open window reads 1.0 and a closed one reads 0.05. There is no second
    // constant here doing the dimming work.
    vec3 warm = vec3(1.00, 0.86, 0.62);
    vec3 skyC = vec3(0.32, 0.42, 0.62);
    vec3 lit  = warm * pool * uRoomLight * 2.4 + skyC * (1.0 - pool) * uRoomLight * 0.55;
    vec3 amb  = vec3(0.10, 0.11, 0.13);          // what a room keeps when no sun is in it
    vec3 room = alb * (lit + amb * (1.0 - uCurtain * 0.35));

    // The curtain, when it is down. It is between the eye and the pane, so it covers the aperture and
    // leaves a rim of glare -- the bright edge is the part that makes the object read as cloth rather
    // than as a black rectangle.
    if (uCurtain > 0.5) {
      // Cloth, not a black rectangle. Three things make it read as fabric rather than as a hole:
      // a vertical drape fold that catches the outside light, a bright edge where the sun leaks past
      // the hem, and a rim of glare around the whole aperture. All three are functions of the window
      // coordinate, so they cost a few ALU and no extra draw call.
      float edge = max(abs(across.x - 0.5), abs(across.y - 0.5));
      float drape = 0.5 + 0.5 * sin(across.x * 26.0);
      float weave = 0.90 + 0.10 * sin(across.x * 210.0 + across.y * 6.0);
      vec3 cloth = vec3(0.30, 0.25, 0.21) * (0.55 + 0.45 * drape) * weave;
      // The sun that gets past the hem: the network says 8.3 % arrives, and this is where it lands.
      float hem = smoothstep(0.0, 0.16, 0.5 - abs(across.y - 0.78));
      cloth += warm * hem * uRoomLight * 6.0;
      // A rim of glare around the aperture, brightest at the top where the sky is.
      float rim = smoothstep(0.40, 0.50, edge);
      cloth += warm * rim * 0.22 * (0.5 + across.y);
      room = mix(room, cloth, 0.92);
    }

    // The room is behind glass: a little of the outside scene reflects off the pane, and the haze in
    // front of it applies as it does to everything else.
    float glass = 0.06;
    room = mix(room, sky * 0.9, glass);
    float hazeR = 1.0 - exp(-t * 0.030);
    col = mix(room, sky * uExposure, hazeR * 0.35);
    outColor = vec4(col, 1.0);
    return;
  }

  // ---- material ----
  vec3 albedo = vec3(0.55);
  if (id == 1) {
    // Ground: warm concrete with a subtle analytic grain that does not alias because it is smooth
    // relative to the pixel footprint at this distance.
    // No procedural grain. It was there to break up a flat surface and it earned its removal: the
    // first attempt aliased into visible moire, and the footprint-filtered second attempt still
    // moired at mid distances because tapering amplitude does not remove a frequency that is already
    // past Nyquist. Concrete is nearly uniform anyway. Variation on large surfaces belongs in
    // lighting and occlusion, which are physically motivated, not in noise, which is not.
    albedo = vec3(0.33, 0.31, 0.28);
    n = vec3(0.0, 1.0, 0.0);
  } else if (id == 2) {
    // Wall: corrugated metal cladding, integrated over the pixel footprint (innovation 3).
    // dFdx gives the exact on-surface footprint width for free.
    float halfU = abs(dFdx(p.y)) * 0.5 + abs(dFdy(p.y)) * 0.5;
    float rib = corrugationMean(p.y, halfU);
    float shade = 0.78 + 0.22 * rib;
    albedo = vec3(0.48, 0.52, 0.56) * shade;
    // Slope of the corrugation, so the ribs catch the sun.
    n = normalize(vec3(0.0, cos(42.0 * p.y) * 0.42, -1.0));
  } else if (id == 3) {
    // Box: weathered timber.
    albedo = vec3(0.46, 0.33, 0.22) * (0.90 + 0.10 * sin(p.z * 30.0));
    // It is a box, so the face normal is the axis along which the point is FURTHEST from the centre,
    // in units of the box's own half-extents. Using raw distance instead of normalised distance picks
    // the wrong axis on the long faces of a non-cubic box, and the shading steps across a visible
    // diagonal — which is what the first render showed on the crate's top.
    vec3 halfExt = (boxHi - boxLo) * 0.5;
    vec3 rel = (p - (boxLo + boxHi) * 0.5) / halfExt;
    vec3 ar = abs(rel);
    n = (ar.x > ar.y && ar.x > ar.z) ? vec3(sign(rel.x), 0.0, 0.0)
      : (ar.y > ar.z)                ? vec3(0.0, sign(rel.y), 0.0)
                                     : vec3(0.0, 0.0, sign(rel.z));
  } else {
    // The body. Neutral, so its shading is readable.
    albedo = vec3(0.72, 0.74, 0.78);
    n = normalize(p - bodyC);
  }

  // ---- lighting ----
  vec3 sunCol = vec3(1.0, 0.955, 0.88);
  float ndl = max(dot(n, uSunDir), 0.0);

  // Analytic soft shadow / partial solar-disc visibility.
  float vis = 1.0;
  if (id == 1 || id == 2) {
    vis = planeVis(p, n, uSunDir, boxLo, boxHi);
  }
  // The crate and the body are themselves unoccluded in this scene, so vis stays 1. A previous
  // version computed a shadow here and then overwrote it with 1.0 - dead code that read as a feature.

  // Ambient: the hemisphere split from ART-DIRECTION §3. Cheap, and the calibration constant rather
  // than a guess — the thermal solver will replace it with computed view factors.
  float upness = n.y * 0.5 + 0.5;
  vec3 ambient = mix(uGroundFill, uSkyFill, upness);

  col = albedo * (sunCol * ndl * vis * 2.1 + ambient * 0.85) * uExposure;

  // Aerial perspective, applied to the LIT colour. Applying it before the lighting term would light
  // the haze itself, which is the kind of mistake that looks almost right and is impossible to debug
  // later. Not a filter either - scattering over distance is real, and it is the cheapest depth cue.
  float haze = 1.0 - exp(-t * 0.030);
  col = mix(col, sky * uExposure, haze * 0.85);

  // Contact darkening where the box meets the ground — analytic, from the solid angle of the box
  // footprint rather than an SSAO pass (which R3 forbids).
  if (id == 1) {
    // Analytic contact darkening: nearer the box, more of the sky hemisphere is occluded by it.
    // No SSAO pass (R3 forbids a full-screen intermediate), so the occlusion is computed from the
    // geometry directly rather than sampled from a buffer.
    float contact = 0.0;
    if (p.x > boxLo.x - 0.7 && p.x < boxHi.x + 0.7 && p.z > boxLo.z - 0.7 && p.z < boxHi.z + 0.7) {
      vec2 c = clamp((p.xz - boxLo.xz) / (boxHi.xz - boxLo.xz), 0.0, 1.0);
      float edge = min(min(c.x, 1.0 - c.x), min(c.y, 1.0 - c.y));
      contact = (1.0 - smoothstep(0.0, 0.22, edge)) * 0.32;
    }
    col *= (1.0 - contact);
  }

  // ---- output ----
  // Deliberate: NO dithering anywhere on a static surface. A bit-identical frame is what lets Mali's
  // hardware tile-elimination fire and skip the memory write (GRAPHICS.md §3). Dither would be
  // prettier and would cost the phone its battery.
  col = col / (col + vec3(1.0));                  // simple tonemap, keeps highlights readable
  col = pow(col, vec3(1.0 / 2.2));

  // ---- sensor grain: the veil, made literal ---------------------------------------------------
  //
  // This is committed for a measurable reason, not a stylistic one. 8-bit output on a smooth
  // gradient bands; a real sensor never shows that band because noise dithers the quantisation
  // step. So a little noise buys real dynamic range in the shadows, which is what lets the image
  // stay dark without turning into stripes - and a dark image is the only kind that reads as space.
  //
  // It is deliberately NOT free of the battery objection. On static surfaces this breaks the
  // bit-identical tile that Mali's CRC uses to skip a memory write, which GRAPHICS.md 3 identifies
  // as the phone's main power saving. So the grain is TEMPORAL (it changes per frame, like a real
  // sensor) and the render-on-demand loop means it only runs when something else already forced a
  // frame - it never wakes the GPU by itself. If R2 ever regresses, this line is the first suspect.
  //
  // Cost: one fract/sin hash, measured in ablate.html rather than asserted here.
  if (uSimple < 0.5) {
    float g = fract(sin(dot(gl_FragCoord.xy + uFrame, vec2(12.9898, 78.233))) * 43758.5453);
    col += (g - 0.5) * 0.016;
  }
  outColor = vec4(col, 1.0);
}`;

// GL setup
// ---------------------------------------------------------------------------------------------
const canvas = $('gl');
const gl = canvas.getContext('webgl2', {
  alpha: false,
  antialias: false,          // analytic edges; MSAA would add bandwidth we cannot afford
  depth: false,              // one full-screen pass, ray-marched in the fragment stage
  stencil: false,
  powerPreference: 'high-performance',
  preserveDrawingBuffer: false,
});

if (!gl) {
  document.body.innerHTML =
    '<p style="padding:24px;color:#ff8a80">WebGL2 is unavailable. This instrument cannot report ' +
    'anything meaningful without it, and says so rather than showing a blank canvas.</p>';
  throw new Error('no webgl2');
}

// ---------------------------------------------------------------------------------------------
// Can this context actually blit a texture into the default framebuffer?
// ---------------------------------------------------------------------------------------------
//
// The renderer's per-frame pass is `blitFramebuffer`, because Reference B measured it at 1.27 ms
// against 1.65 ms for the equivalent texture-read triangle, and R2's budget is 1.5 ms. So the
// mechanism is load-bearing and cannot be assumed.
//
// The specific hazard is sample counts. `blitFramebuffer` from a single-sample attachment into a
// MULTISAMPLE destination is INVALID_OPERATION (0x0502): it draws nothing, throws nothing, and logs
// nothing a page would notice. `antialias: false` above is what prevents it, but on some devices the
// browser hands out a multisampled default framebuffer regardless, and `getContextAttributes()` is
// allowed to report one thing while the implementation does another. So this tests the operation
// rather than the attribute, once, at startup, with a 4x4 texture whose worth is one allocation.
//
// A false result is not fatal: the caller falls back to the texture-read triangle and the HUD says
// which path is live. What would be fatal is falling back silently and leaving the clock claiming a
// number the renderer is not earning.
// `?blit=0` forces the fallback. It exists because the two mechanisms must be shown to produce the
// SAME IMAGE before the faster one is allowed to be the default -- a blit that silently copies nothing
// would look exactly like a passing frame time. It also lets the decision be made on the device it
// matters on: load the page twice, once with and once without, and compare.
const FORCE_NO_BLIT = new URLSearchParams(location.search).get('blit') === '0';
const blitSupported = (() => {
  if (FORCE_NO_BLIT) return false;
  const prevFbo = gl.getParameter(gl.FRAMEBUFFER_BINDING);
  const prevTex = gl.getParameter(gl.TEXTURE_BINDING_2D);
  let ok = false;
  try {
    while (gl.getError() !== gl.NO_ERROR) { /* drain, so the read below is ours */ }
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, 4, 4);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  gl.bindTexture(gl.TEXTURE_2D, prevTex);

  // this binding and copied into `bench` once that object exists. Assigning to bench.blitSupported at
  // this point throws `Cannot access 'bench' before initialization` and the whole module never runs.

const defaultSamples = gl.getParameter(gl.SAMPLES);

function compile(type, src) {

const prog = gl.createProgram();

gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));

const U = {
  res: gl.getUniformLocation(prog, 'uRes'),
  time: gl.getUniformLocation(prog, 'uTime'),
  sunDir: gl.getUniformLocation(prog, 'uSunDir'),
  sunHalfAngle: gl.getUniformLocation(prog, 'uSunHalfAngle'),
  skyFill: gl.getUniformLocation(prog, 'uSkyFill'),
  groundFill: gl.getUniformLocation(prog, 'uGroundFill'),
  quality: gl.getUniformLocation(prog, 'uQuality'),
  orbitPos: gl.getUniformLocation(prog, 'uOrbitPos'),
  frame: gl.getUniformLocation(prog, 'uFrame'),
  taps: gl.getUniformLocation(prog, 'uTaps'),
  simple: gl.getUniformLocation(prog, 'uSimple'),
  exposure: gl.getUniformLocation(prog, 'uExposure'),
  roomLight: gl.getUniformLocation(prog, 'uRoomLight'),
  curtain: gl.getUniformLocation(prog, 'uCurtain'),
  winC: gl.getUniformLocation(prog, 'uWinC'),
  winHalf: gl.getUniformLocation(prog, 'uWinHalf'),
};

// The window, in scene units. The wall is at z = 14, its top edge at 7.0, and the camera at z = -2.6
// looking slightly down. These numbers put the pane where a ground-floor room's window sits in this
// frame: high enough to see sky, low enough that the sun lands on the floor rather than the ceiling.
const WINDOW_CENTRE = [0.55, 3.05, 14.0];
const WINDOW_HALF = [1.15, 1.25];

// sunDir is recomputed per frame from the sun's declination (see sunDirection()).
gl.uniform1f(U.sunHalfAngle, SUN_HALF_ANGLE);
gl.uniform3fv(U.skyFill, SKY_FILL);
gl.uniform3fv(U.groundFill, GROUND_FILL);

// ---------------------------------------------------------------------------------------------
// TWO PROGRAMS, and the reason is the ablation numbers
// ---------------------------------------------------------------------------------------------
//
// Measured on the phone (web/ablate.html, Reference B):
//
//     floor (shades nothing)     0.75 ms      <- what the device charges for touching pixels
//     full shader               49.00 ms
//     without the solar shadow  16.08 ms      <- so the shadow is 33 ms, 67% of the frame
//
// Two conclusions, both fatal to the single-shader design:
//
//  1. No amount of tuning reaches 1.5 ms at native resolution. Even with the shadow deleted the
//     shader is 16 ms, and 1.5 ms is ~14 ALU ops/pixel. Analytic per-pixel shading has a floor
//     below native resolution on this GPU.
//
//  2. The floor is 0.75 ms. So the DEVICE is not the problem - the per-pixel work is. Which means
//     the answer is not a cheaper shader, it is not re-shading what has not changed.
//
// That is what R2 asks for and the shell never had: "if it does not settle, the temporal cache is
// lying about what is static". There was no cache to lie.
//
// The design this forces is the painting test taken literally: shade the expensive image ONCE into
// an off-screen target, then draw that target. Static surfaces cost a blit, not a shade. What makes
// it a renderer rather than a screenshot is that the blit reads a per-pixel DIRTY MASK, so regions
// that recompute are re-shaded and regions that did not are just copied.
//
// R3 is the constraint that decides the layout: under 32 bytes per screen pixel per frame. A blit
// plus a mask read costs about 8, so the budget holds - but nothing here may add a second
// full-screen intermediate.

const CHEAP_FRAG = `#version 300 es
precision highp float;

uniform sampler2D uShaded;   // the expensive image from the last full shade
uniform sampler2D uShadow;   // per-pixel: 0 = still valid, 1 = needs re-shading
uniform vec2 uRes;

out vec4 outColor;

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  // 8-bit RGBA: one read. This is the whole per-frame cost of a static scene.
  outColor = texture(uShaded, uv);
}`;

const cheapProg = gl.createProgram();
{
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, VERT); gl.compileShader(vs);
  if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) throw new Error('cheap vert: ' + gl.getShaderInfoLog(vs));
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, CHEAP_FRAG); gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) throw new Error('cheap frag: ' + gl.getShaderInfoLog(fs));
  gl.attachShader(cheapProg, vs); gl.attachShader(cheapProg, fs); gl.linkProgram(cheapProg);
  if (!gl.getProgramParameter(cheapProg, gl.LINK_STATUS)) throw new Error('cheap link: ' + gl.getProgramInfoLog(cheapProg));
}

const UQ = {
  shaded: gl.getUniformLocation(cheapProg, 'uShaded'),
  shadow: gl.getUniformLocation(cheapProg, 'uShadow'),
  res: gl.getUniformLocation(cheapProg, 'uRes'),

// A VAO is required by core GL even when drawing with gl_VertexID and no attributes.
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

// ---------------------------------------------------------------------------------------------
// render-on-demand, and the state machine that makes R2 falsifiable
// ---------------------------------------------------------------------------------------------
//
// The whole claim of R2 is that when nothing changes, nothing is drawn. Note what is NOT here:
// no requestAnimationFrame loop when idle. A loop that runs at 60 Hz but draws a cached frame is
// not render-on-demand, it is a loop — and it would pass a naive fps measurement while burning the
// battery the phone is meant to keep. The loop below is *requested*, never perpetual.

const state = {
  needsFrame: true,
  lastInput: 0,
  dirty: true,
  scale: 1.0,               // render scale; the documented fallback is 0.5
  useHalfRes: false,
  exposure: 1.0,        // stops; the control a camera operator actually turns
  // Quality knobs the measurements justified, not invented:
  //   shadowTaps - 8 measured below one pixel of penumbra error, 4 costs half as much and shows
  //                some banding. The shadow is 65% of the frame, so this is the single biggest lever.
  //   simpleGeometry - the floor is 0.67 ms at 1.04 Mpx, i.e. 45% of the 1.5 ms budget, so on a
  //                screen that small per-pixel features are the only way to buy shadow quality.
  shadowTaps: 8,
  simpleGeometry: 0,
};

// wrap into [0, 2π). Written out rather than using %, because % on a negative number returns a
// negative remainder and this is precisely the kind of detail that produces a body moving backwards
// once per orbit and blames the renderer.
function wrapTwoPi(x) {
  const twoPi = 2 * Math.PI;
  let r = x % twoPi;
  if (r < 0) r += twoPi;
  return r;
}

// ---------------------------------------------------------------------------------------------
// The pixel budget, and why it is this number and not the one it used to be.
//
// R2 is a frame cost AND a resolution, because frame cost is very nearly linear in pixels. On
// Reference B (Mali-G51, 1.04 Mpx) the pass this renderer actually runs -- `blitFramebuffer`, per
// `m-path` -- was measured at 1.27 ms, i.e. 1.221 ms/Mpx. 1.5 ms therefore buys 1.228 Mpx, and with
// the ~15% margin the plan quotes for a measurement made on someone else's device (3-year-old phone
// silicon, thermal variance, a single session) it buys 1.068 Mpx.
//
// WHAT THIS CAP USED TO BE, AND WHY IT WAS WRONG. It was a bare `1_150_000`, sitting between the
// 1.228 Mpx the budget buys and the ~1.15 Mpx an earlier (retracted) revision of GRAPHICS.md named as
// the clause. It had no derivation, and it was ABOVE both the measured reach and a different current
// doc claim (0.68 Mpx) that was derived from a texture-read figure this project has since RETRACTED.
// So the constant agreed with nothing: not the measurement, not the doc, not the margin. It is now
// derived from the measurement in this comment, and `tools/check-pixel-budget.mjs` recomputes that
// derivation from the numbers and fails if the constant, the comment and GRAPHICS.md ever disagree.
//
// The cost of using the budget's full reach: a 1600x1000 deselected window previously rendered at
// 1.15 Mpx and now renders at 1.068 Mpx, which is 7% fewer pixels and a 3.6% softer image. That is the
// price of being able to say what the number is.
// ---------------------------------------------------------------------------------------------
const CLAUSE_MPX = 1.068;
const MAX_PIXELS = Math.round(CLAUSE_MPX * 1e6);

function dpr() { return Math.min(window.devicePixelRatio || 1, 2); }

function resize() {
  // -------------------------------------------------------------------------------------------
  // The pixel budget.
  //
  // R2 was written as "1.5 ms", which is resolution-dependent, and nothing in the doc said at what
  // resolution. On a phone the browser hands us 756x1382 at dpr 2 = 1.04 Mpx, and 1.5 ms of that is
  // about 14 ALU ops per pixel on a Mali-G51 - fewer than a single Phong term. So an unbudgeted
  // canvas and a 1.5 ms target are not simultaneously satisfiable by any renderer, however good.
  //
  // This caps the drawing buffer at MAX_PIXELS and lets CSS upscale it. That is the documented
  // fallback (GRAPHICS.md 5) applied as the DEFAULT rather than as something the user has to find.
  // The HUD reports the true size so the cap is never invisible.
  // -------------------------------------------------------------------------------------------
  const cssW = Math.max(1, window.innerWidth);
  const cssH = Math.max(1, window.innerHeight);

  let w = cssW * dpr() * state.scale;
  let h = cssH * dpr() * state.scale;
  const px = w * h;
  if (px > MAX_PIXELS) {
    const k = Math.sqrt(MAX_PIXELS / px);
    w *= k;
    h *= k;
  }

  const wantW = Math.max(1, Math.round(w));
  const wantH = Math.max(1, Math.round(h));
  if (canvas.width !== wantW || canvas.height !== wantH) {
    canvas.width = wantW;
    canvas.height = wantH;
    // SETTING needsFrame IS NOT ENOUGH. Under render-on-demand nothing is scheduled unless something
    // asks for a frame, so a resize changed the drawing buffer and then nothing ever drew into it -
    // the window kept showing the old image at the old size, and the cache never noticed. The canvas
    // and the cache disagreed (700x500 vs 900x560) and the page looked merely out of date.
    //
    // This is the hazard of render-on-demand in one line: every state change must explicitly ask for
    // the frame that consumes it, or it is silently dropped.
    requestFrame();
  }
}
window.addEventListener('resize', resize);

// measurement

function quantile(sorted, q) {
  if (sorted.length === 0) return NaN;
  const i = (sorted.length - 1) * q;
  const lo = Math.floor(i), hi = Math.ceil(i);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);

  // including it would flatter or punish the measurement for reasons having nothing to do with the
  // renderer. R2 asks about the settled state, so the settled state is what gets timed.

  gpuSamples: [],       // steady-state GPU times, ms, from the timer query when the browser exposes it

// hanging the button. See the note in `measureFrame()` for why one synchronous read was not enough.
const GPU_QUERY_WAIT_FRAMES = 30;
// ...and a wall-clock ceiling, because frames are not time. Two frames was measured to be enough on
// ANGLE for a query issued to a warm timing pipeline; 120 ms per sample is generous for hardware and
// keeps twelve samples under a second and a half even when a driver never reports at all.
//
// KNOWN LIMITATION, measured on this sandbox rather than assumed: ANGLE/SwiftShader keeps its timing
// pipeline cold for the first ~1.5 s, so queries issued in that window never report and only the last
// few samples survive. That is a property of a software rasteriser, not of the phone the claim is about,
// which is why it is reported rather than worked around -- see the sample-count line in the panel, which
// says how many of the twelve the driver actually returned.
const GPU_QUERY_WAIT_MS = 120;
let pendingQuery = null;   // an issued query awaiting its result
let queryActive = false;   // a query that has been begun and not yet ended

// *outstanding* (waiting for its result) is not a query that is *active* (begun and not ended), so
// `endQuery` on the former is INVALID_OPERATION and poisons the GL error state for everything after.
function beginGpuTimer() {

}
// `steady` gates whether the result is kept, and it is not a detail. The first frame after an idle
// gap is a cold frame: shader wake-up, cold caches, possibly a clock ramp. On this sandbox the first
// GPU query after the boot burst read 309 ms for a frame the same device otherwise did in 0.1 ms.
// Reporting that as "frame time" is how a benchmark produces a scary number that means nothing.
function pollGpuTimer(steady) {
  if (!disjointExt || !pendingQuery) return;
  const done = gl2.getQueryParameter(pendingQuery, gl2.QUERY_RESULT_AVAILABLE);
  const disjoint = gl2.getParameter(disjointExt.GPU_DISJOINT_EXT);
  if (done && !disjoint && steady) {
    bench.gpuSamples.push(gl2.getQueryParameter(pendingQuery, gl2.QUERY_RESULT) / 1e6);
    if (bench.gpuSamples.length > 120) bench.gpuSamples.shift();
  }
  if (done) { gl2.deleteQuery(pendingQuery); pendingQuery = null; }
}

// The orbit itself is no longer computed here -- see the kernel boundary further down, which calls
// `odderon-astro` through wasm. What remains in this file is presentation: the sun, the camera, the
// shading. Anything that describes *where the satellite is* comes from the kernel.
// ---------------------------------------------------------------------------------------------
// The sun, as an actual direction rather than a hand-picked vector
// ---------------------------------------------------------------------------------------------
//
// A lighting constant is a number nobody can check. The sun's declination is astronomy: it is the
// angle between the sun and the celestial equator, it swings between 23.44 deg N in June and 23.44 deg
// S in December, and it is computable to well under a degree with the standard low-precision formula.
// That makes the shadow direction a claim about Earth's axial tilt rather than a taste.
//
// Low-precision solar coordinates (NOAA / Meeus, good to ~0.01 deg for our purposes), so no astronomy
// tables are needed to check this.
function solarDeclination(msNow) {
  const D = (msNow / 86400000) + 2440587.5 - 2451545.0;   // Julian days since J2000
  const g = ((357.529 + 0.98560028 * D) * Math.PI) / 180;   // mean anomaly
  const q = 280.459 + 0.98564736 * D;                       // mean longitude
  const L = (((q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) % 360) + 360) % 360;
  const e = ((23.439 - 0.00000036 * D) * Math.PI) / 180;    // obliquity, slowly decreasing
  const lambda = (L * Math.PI) / 180;
  return Math.asin(Math.sin(e) * Math.sin(lambda));         // radians; +N, -S
}

// Scene direction to the sun. The scene is a fixed view, so the point of interest is that the light
// actually moves with the calendar: run this at the two solstices and the shadows differ.
function sunDirection(declRad) {
  const el = Math.max(0.08, 0.55 + 0.42 * Math.sin(declRad));   // elevation rises with declination
  const az = Math.PI * 0.72;                                     // fixed azimuth for this view
  return [-Math.cos(az) * Math.cos(el), Math.sin(el), -Math.sin(az) * Math.cos(el)];
}

// ---------------------------------------------------------------------------------------------
// THE KERNEL BOUNDARY — this is the real thing now, not a stand-in
// ---------------------------------------------------------------------------------------------
//
// This function used to solve Kepler's equation in JavaScript and return a position. That stand-in was
// honest about being one, but it had a structural limitation that no amount of care could fix: **it
// returned a position and no velocity.** The page therefore had no state it could advance, which is the
// one thing a render-on-demand renderer needs — wake after an idle gap, ask where the satellite is now,
// and get the same answer the kernels' tests agree on.
//
// It now calls `odderon-astro` through wasm: universal-variable Kepler on a real `(r, v)` state, with
// the reference orbit built inside the kernel from `Elements::to_state` so the page and the native tests
// propagate the same orbit from the same numbers.
//
// THREE DESIGN DECISIONS, each because the alternative is a specific failure this project has had:
//
//  1. **No substitute orbit.** If the module is missing, no position is computed and the body is hidden;
//     the page does not quietly draw a different orbit. A silent fallback is how a page ends up
//     describing behaviour the code does not implement, which is the defect this project keeps having to
//     withdraw claims over. (Note what this deliberately does NOT do: it does not stop rendering. The
//     scene, the shading and the R2 measurement have nothing to do with the orbit, and refusing to draw
//     would break the instrument on any machine — including the sandboxed preview — that has no build.
//     The body is placed far outside the frame instead, and the HUD names the reason.)
//  2. **The module's constants are required, and verified where they can be.** `orbit_mu()`,
//     `orbit_semi_major_axis()` and `orbit_eccentricity()` must exist before the page will draw, so a
//     module that does not carry the kernel's own constants is rejected at load rather than drawn. The
//     page does not itself re-derive anything from them — `SCENE_KM` below is the one display constant —
//     and `tools/check-orbit.mjs` is what actually calls them and checks them against physics. Saying
//     "the page reads mu from the kernel" would have been the kind of claim this file keeps having to
//     withdraw, so it is not made.
//  3. **Convergence is surfaced, not assumed.** `propagate` reports iterations and an `unconverged`
//     flag; both cross the boundary and both are read every frame. A caller that ignores a failed solve
//     is taking a number on trust.
const kernelState = { module: null, status: 'not loaded', attempted: false, lastError: null };

/// Load the kernel module, once, returning the instantiated exports or null.
///
/// The module is standalone — no imports — so instantiation needs no import object. That is the property
/// `crates/odderon-dmath-wasm` was built for, and it is what lets both Node and the browser load it.
async function loadKernel() {
  if (kernelState.attempted) return kernelState.module;
  kernelState.attempted = true;
  // `/dist/` is the served build output: `npm run fetch:wasm` (and the CI artifact) put the module there.
  const url = '/dist/odderon_dmath_wasm.wasm';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const bytes = await res.arrayBuffer();
    const { instance } = await WebAssembly.instantiate(bytes, {});
    const ex = instance.exports;
    // Every export the page depends on, named. A partially-built module must fail here rather than at
    // the first draw, where the symptom would be a stale orbit rather than a missing function.
    const needed = ['orbit_state_x', 'orbit_state_y', 'orbit_state_z',
                    'orbit_velocity_x', 'orbit_velocity_y', 'orbit_velocity_z',
                    'orbit_iterations', 'orbit_unconverged',
                    'orbit_mu', 'orbit_semi_major_axis', 'orbit_eccentricity',
                    // The room. Claim 2 is the reason this build exists, and these are the four
                    // numbers that make it visible instead of merely measured.
                    'room_solar_w', 'room_light_fraction', 'room_cooling_w', 'room_draw_w'];
    const missing = needed.filter((n) => typeof ex[n] !== 'function');
    if (missing.length) throw new Error('module missing exports: ' + missing.join(', '));
    kernelState.module = ex;
    kernelState.status = 'wasm';
    return ex;
  } catch (e) {
    kernelState.module = null;
    kernelState.status = 'unavailable: ' + (e && e.message ? e.message : String(e));
    kernelState.lastError = e && e.message ? e.message : String(e);
    return null;
  }
}

/// Scene units per kilometre. The camera sits 1.6 units up and the orbit is deliberately large, so this
/// is a display choice, not a physical one — but it is the *only* one, applied in one place.
const SCENE_KM = 0.00055;

/// The satellite's scene-space position at `tSeconds`, from the kernel.
///
/// Returns `NO_ORBIT_POSITION` — a point outside the frame — when the kernel is unavailable or the solve
/// did not converge. There is no numeric substitute orbit: see decision 1 above.
///
/// BUT A NULL POSITION MUST NOT STOP THE FRAME. The first version of this returned `null` and had
/// `drawFrame` bail out entirely, which broke the instrument on every machine without a built wasm
/// artifact -- including the in-app preview, which is sandboxed with no network. That is a bad trade: the
/// scene, the shading and the whole R2 measurement have nothing to do with the orbit. So the body is
/// drawn at a position far outside the scene, which removes it from the image
/// (`uOrbitPos` = (0, -1e4, 4) is below the ground plane where nothing is visible), while every other
/// pixel is shaded exactly as before. The HUD says `orbit source: unavailable: <reason>`, so the missing
/// body is diagnosed rather than mysterious, and nothing claims the orbit was computed when it was not.
/// The room, as the thermal network computes it.
///
/// **This is not a simulation of a room with a curtain.** `state.curtain` is the input, the network
/// computes what the window passes and what the AC must draw to hold the setpoint, and the shader
/// multiplies its sun radiance by the resulting fraction. The page holds no thermal constant of its own
/// -- no SHGC, no area, no COP, no degradation coefficient. If one appeared here, the picture would
/// stop being a consequence of the solver and start being a palette with a solver next to it.
///
/// Filled by `refreshRoom()`, which is called once per change rather than per frame: the network is a
/// pure function of one boolean, so recomputing it 60 times a second would be a cost with no content.
const roomState = {
  curtain: false,
  solarW: NaN,
  lightFraction: NaN,
  coolingW: NaN,
  drawW: NaN,
  source: 'unavailable',
};

function refreshRoom() {
  const k = kernelState.module;
  if (!k) {
    roomState.source = 'unavailable';
    roomState.solarW = roomState.coolingW = roomState.drawW = roomState.lightFraction = NaN;
    return;
  }
  const c = roomState.curtain ? 1 : 0;
  roomState.solarW = k.room_solar_w(c);
  roomState.lightFraction = k.room_light_fraction(c);
  roomState.coolingW = k.room_cooling_w(c);
  roomState.drawW = k.room_draw_w(c);
  roomState.source = 'wasm kernel';
}

/// Recompute the room AND invalidate the cache.
///
/// The invalidation is not defensive tidiness -- without it this silently does nothing, which is the
/// exact failure mode this file already records for the shadow-tap and detail controls ("switching
/// either MUST invalidate the cache or it will silently do nothing"). The room is shaded once, on the
/// first frame, while `lightFraction` is still NaN and therefore 0; the kernel answers a moment later,
/// and every subsequent frame blits that first cold image back. Measured: the panel read
/// `1440 W 100.0%` beside a pane rendered at 0 % -- a picture contradicting its own instrument, which
/// is the defect this project has deleted three times.
function setCurtain(curtain) {
  roomState.curtain = curtain;
  refreshRoom();
  cache.valid = false;      // the room is part of the shaded image
  requestFrame();
}

const NO_ORBIT_POSITION = [0.0, -1e4, 4.0];

/// Diagnostics from the last propagation: how hard the solve was, and whether it failed.
///
/// Read from the kernel rather than assumed. A solver that gives up and returns its last iterate
/// produces a position that looks like every other position, so "converged" has to be asked for.
const orbitDiag = { iterations: 0, unconverged: false };

function orbitPosition(tSeconds) {
  const k = kernelState.module;
  if (!k) return NO_ORBIT_POSITION;
  const dt = tSeconds;

  // Ask whether the solve succeeded BEFORE believing the numbers. A non-converged universal-variable
  // solve still returns a finite triple, so checking `Number.isFinite` would happily accept it.
  orbitDiag.unconverged = k.orbit_unconverged(dt) !== 0;
  orbitDiag.iterations = k.orbit_iterations(dt);
  if (orbitDiag.unconverged) return NO_ORBIT_POSITION;

  const x = k.orbit_state_x(dt), y = k.orbit_state_y(dt), z = k.orbit_state_z(dt);
  if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) return NO_ORBIT_POSITION;
  // The kernel's frame is the orbit plane; the page wants it tilted so the ellipse reads as an ellipse.
  // This rotation is presentation and stays here — the kernel has no opinion about cameras.
  const inc = 0.55, yaw = 0.9;
  const xi = x, yi = y * Math.cos(inc), zi = z + y * Math.sin(inc);
  const xr = xi * Math.cos(yaw) - yi * Math.sin(yaw);
  const yr = xi * Math.sin(yaw) + yi * Math.cos(yaw);
  return [xr * SCENE_KM, 2.9 + yr * SCENE_KM, 9.0 + zi * SCENE_KM];
}

/// Velocity in km/s at `tSeconds`, from the kernel. Exposed so the page can report a real speed rather
/// than a constant it invented, and so a test can check the two agree.
function orbitVelocity(tSeconds) {
  const k = kernelState.module;
  if (!k) return null;
  return [k.orbit_velocity_x(tSeconds), k.orbit_velocity_y(tSeconds), k.orbit_velocity_z(tSeconds)];
}

// ---------------------------------------------------------------------------------------------
// the draw
// ---------------------------------------------------------------------------------------------

// ---------------------------------------------------------------------------------------------
// The temporal cache
// ---------------------------------------------------------------------------------------------
//
// One RGBA8 texture holding the shaded image, allocated once and resized only when the drawing buffer
// changes. There is exactly ONE off-screen target, because R3 is a bandwidth ceiling and an
// intermediate costs a full write plus a full read.
//
// `dirty` is the honest part. A renderer that never re-shades anything is a screenshot. So the cache
// tracks what actually changed:
//
//   - a resize or a scale change invalidates everything
//   - the sun's direction moves with the calendar, so it is compared and invalidates when it moves
//   - exposure changes invalidate
//   - the orbiting body moves every frame, so it is re-shaded every frame
//
// Anything not on that list is static, and static is what R2 measures.
const cache = {
  tex: null,
  fbo: null,
  w: 0,
  h: 0,
  valid: false,
  lastSun: null,
  lastExposure: NaN,
  // measured at runtime, not asserted
  lastFullShadeMs: NaN,
  lastBlitMs: NaN,
  // A textbook cache texture, used only by the R2 upper bound. Same size and format as `tex`, but it is
  // written by a shader and never sampled, so reading it cannot be met by a cache hit the way re-reading
  // `tex` can. See `upperBoundBlit()`.
  probeTex: null,
  probeFbo: null,
  fullShades: 0,
  blits: 0,
};

function cacheResize(w, h) {
  if (cache.w === w && cache.h === h && cache.tex) return;
  if (cache.tex) gl.deleteTexture(cache.tex);
  if (cache.fbo) gl.deleteFramebuffer(cache.fbo);
  if (cache.probeTex) gl.deleteTexture(cache.probeTex);
  if (cache.probeFbo) gl.deleteFramebuffer(cache.probeFbo);

  // The probe target for the R2 upper bound. Never sampled, so it cannot be served from cache the way
  // the real cache texture is on the second and later reads.
  cache.probeTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, cache.probeTex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  cache.probeFbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, cache.probeFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, cache.probeTex, 0);
  const pst = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if (pst !== gl.FRAMEBUFFER_COMPLETE) { cache.probeFbo = null; }

  cache.tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, cache.tex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  cache.fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, cache.fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, cache.tex, 0);
  const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if (st !== gl.FRAMEBUFFER_COMPLETE) throw new Error('cache FBO incomplete: 0x' + st.toString(16));

  cache.w = w; cache.h = h;
  cache.valid = false;
}

// What invalidates the cache. Kept as one predicate so the list cannot drift from the comment above.
function cacheInvalidated(sun) {
  if (!cache.valid) return true;
  if (cache.lastExposure !== state.exposure) return true;
  if (cache.lastTaps !== state.shadowTaps) return true;
  if (cache.lastSimple !== state.simpleGeometry) return true;
  if (!cache.lastSun || Math.abs(sun[0] - cache.lastSun[0]) > 1e-6 ||
      Math.abs(sun[1] - cache.lastSun[1]) > 1e-6 || Math.abs(sun[2] - cache.lastSun[2]) > 1e-6) return true;
  return false;
}

function captureNow() {
  // The in-frame pixel probe. `preserveDrawingBuffer` is false (it costs bandwidth), so a readback
  // outside a draw returns an empty buffer: this must be called from inside the frame that drew.
  //
  // IT READS THE CACHE, NOT THE SCREEN, AND THAT IS A CORRECTION RATHER THAN A PREFERENCE.
  //
  // This probe's question is "did the cached image change", so the cache is the right target. Reading
  // the default framebuffer instead was measured to be backend-dependent once the per-frame pass became
  // a `blitFramebuffer`: on ANGLE/SwiftShader a `readPixels` from the default framebuffer after a blit
  // returns black, while the same read after the texture-read triangle returns the image -- even with a
  // `gl.finish()` first, and with both framebuffer bindings confirmed null. The PRESENTED frame is
  // correct on both paths (screenshot comparison in `tools/check-cache.mjs` is pixel-identical), so this
  // is a readback quirk, not a rendering fault. Probing the cache sidesteps it and answers the question
  // the probe actually asks.
  captureReq.want = false;
  const n = captureReq.size;
  // Bind the cache for reading. `blitFrame()` already restored READ to null, so this is explicit.
  const prevRead = gl.getParameter(gl.READ_FRAMEBUFFER_BINDING);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, cache.fbo);
  const buf = new Uint8Array(4);
  const colours = new Set();
  let mean = 0;
  let count = 0;
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const px = Math.floor(((x + 0.5) * canvas.width) / n);
      const py = Math.floor(((y + 0.5) * canvas.height) / n);
      gl.readPixels(px, py, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      colours.add(((buf[0] >> 3) << 6) | ((buf[1] >> 3) << 3) | (buf[2] >> 3));
      mean += (buf[0] + buf[1] + buf[2]) / 3;
      count++;
    }
  }
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, prevRead);
  captureReq.resolve({ distinctColours: colours.size, meanLuma: mean / count });
}

function drawFrame(nowMs) {
  const t0 = performance.now();

  // When the kernel is missing this is a position far outside the scene rather than a substitute orbit:
  // the body disappears and the HUD says why, while the rest of the frame is shaded honestly.
  const satPos = orbitPosition(nowMs / 1000);

  gl.viewport(0, 0, canvas.width, canvas.height);
  cacheResize(canvas.width, canvas.height);

  // The light comes from the actual sun: declination for today's date, so the shadow direction is a
  // consequence of Earth's axial tilt and not a number someone liked the look of.
  const sun = sunDirection(solarDeclination(Date.now()));

  // --------------------------------------------------------------------------------------------
  // full shade, ONLY when something actually changed
  // --------------------------------------------------------------------------------------------
  let path = 'blit';

  if (cacheInvalidated(sun)) {
    const a = performance.now();

    gl.bindFramebuffer(gl.FRAMEBUFFER, cache.fbo);
    gl.viewport(0, 0, cache.w, cache.h);
    gl.useProgram(prog);

    gl.uniform2f(U.res, cache.w, cache.h);
    gl.uniform1f(U.time, nowMs / 1000);
    gl.uniform1f(U.quality, state.scale);
    gl.uniform3fv(U.orbitPos, satPos);
    gl.uniform3fv(U.sunDir, sun);
    gl.uniform1f(U.frame, bench.framesDrawn % 1024);
    gl.uniform1f(U.exposure, state.exposure);
    // THE ROOM. `uRoomLight` is the network's ratio of two solar gains, not a brightness constant:
    // closing the curtain makes it 0.0833 because SHGC went from 0.60 to 0.05, and nothing else did.
    gl.uniform1f(U.roomLight, Number.isFinite(roomState.lightFraction) ? roomState.lightFraction : 0.0);
    gl.uniform1f(U.curtain, roomState.curtain ? 1.0 : 0.0);
    gl.uniform3fv(U.winC, WINDOW_CENTRE);
    gl.uniform2fv(U.winHalf, WINDOW_HALF);
    gl.uniform1i(U.taps, state.shadowTaps);
    gl.uniform1f(U.simple, state.simpleGeometry);

    beginGpuTimer();
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    endGpuTimer();

    // Both, for the same reason as in `blitFrame()`: a split READ/DRAW binding left behind here makes
    // the next `readPixels` read the cache rather than the screen.
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);

    cache.valid = true;
    cache.lastSun = sun;
    cache.lastExposure = state.exposure;
    cache.lastTaps = state.shadowTaps;
    cache.lastSimple = state.simpleGeometry;
    cache.fullShades++;
    cache.lastFullShadeMs = performance.now() - a;
    path = 'shade';
  }

  // --------------------------------------------------------------------------------------------
  // the blit: the entire cost of a static frame
  // --------------------------------------------------------------------------------------------
  //
  // THIS IS NOW A REAL `blitFramebuffer`, NOT A FULL-SCREEN TRIANGLE THAT SAMPLES THE CACHE.
  //
  // Reference B measured the two as different costs at 1.04 Mpx: **1.27 ms for the blit against
  // 1.65 ms for the texture read**, on the same device in the same session. R2's 1.5 ms budget sits
  // between them, so the choice of mechanism is the whole of R2's margin -- 1.27 ms passes and 1.65 ms
  // does not. Sampling the cache in a fragment shader costs a texture fetch and a rasterised quad per
  // pixel; `blitFramebuffer` asks the driver to move the pixels, which on a tiled GPU never has to
  // shade anything.
  //
  // It is legal here because `web/index.html` requests `antialias: false`, so the default framebuffer
  // is single-sample and matches the cache's sample count. THAT IS A HARD PRECONDITION, not a detail:
  // blitting from a single-sample texture into a MULTISAMPLE default framebuffer is a GL
  // INVALID_OPERATION (0x0502), which returns no pixels and reports no other symptom. A probe on this
  // sandbox reproduced exactly that -- identical code, `antialias: true` gave 0x0502 and `antialias:
  // false` gave 0 -- so the check is done at startup rather than trusted.
  //
  // `blitSupported` is that check. When it is false the renderer falls back to the texture-read
  // triangle it used to run unconditionally, and says so in the HUD, because a silent fallback would
  // put 1.65 ms on the clock while the page claimed 1.27.
  const b0 = performance.now();
  blitFrame();
  cache.lastBlitMs = performance.now() - b0;
  cache.blits++;

  const t1 = performance.now();
  // The CPU-side submit cost. `gl.finish()` would give a truer wall-clock frame time but it is a
  // synchronous GPU stall and PERFORMANCE.md forbids that in the loop - so it is never called here.
  const submitMs = t1 - t0;

  bench.framesDrawn++;
  bench.lastPath = path;
  bench.lastPixels = canvas.width * canvas.height;
  // Bandwidth, counted rather than hoped for. A blit is one colour write plus one texture read, so
  // 8 bytes per pixel. A full shade also writes the cache, so 12. R3's ceiling is 32.
  bench.lastBytes = bench.lastPixels * (path === 'shade' ? 12 : 8);

  const since = nowMs - bench.lastSubmit;
  const steady = bench.lastSubmit > 0 && since < bench.gapLimitMs;
  if (steady) {
    bench.submitSamples.push(submitMs);
    if (bench.submitSamples.length > 240) bench.submitSamples.shift();
  }
  bench.lastSubmit = nowMs;

  pollGpuTimer(steady);

  if (captureReq.want) captureNow();
  if (pictureReq.want) {
    // THE PICTURE IS COPIED FROM THE CACHE, NOT FROM THE SCREEN, and that is a correction.
    //
    // This block used to do `ctx2d.drawImage(canvas, 0, 0)` inside the draw. That is a readback of the
    // DEFAULT FRAMEBUFFER, and on this backend a readback of the default framebuffer after a
    // `blitFramebuffer` returns BLACK -- the same quirk documented on `captureNow()` above, which is
    // why the pixel probe was moved onto the cache and this one was not. The result was that every
    // saved picture, at every device pixel ratio, showed the panel over a black scene while the live
    // page rendered correctly. `tools/check-hud-capture.mjs` could not see it: its mask is built from
    // the PANEL, so a black scene around a perfect panel scored IoU 1.000.
    //
    // Measured on this sandbox, on one page load, 200 sampled pixels each: the cache reads mean luma
    // 146.3 with 200/200 non-black, and the default framebuffer reads 0.0 with 0/200. The presented
    // frame is correct on both paths, so this is a readback quirk rather than a rendering fault -- but
    // an artifact a person judges claim 5 from is not allowed to be the thing the quirk eats.
    //
    // Reading the cache works on BOTH paths, because the cache holds the shaded image whether the
    // per-frame pass was a blit or the texture-read triangle. It is also always exactly the drawing
    // buffer's size: `cacheResize()` is only ever called with `canvas.width/height`, and
    // `tools/check-cache.mjs` asserts "cache size follows the drawing buffer" rather than trusting it.
    pictureReq.want = false;
    const c = document.createElement('canvas');
    c.width = cache.w;
    c.height = cache.h;
    const ctx2d = c.getContext('2d');
    const rowBytes = c.width * 4;
    const px = new Uint8Array(rowBytes * c.height);
    const prevRead = gl.getParameter(gl.READ_FRAMEBUFFER_BINDING);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, cache.fbo);
    gl.readPixels(0, 0, c.width, c.height, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, prevRead);
    // GL's origin is bottom-left and a canvas's is top-left, so the rows come out inverted. Copying
    // them straight through would save a picture of the scene upside down -- visible, but the kind of
    // visible that gets dismissed as "the camera is flipped" rather than as a bug.
    const img = ctx2d.createImageData(c.width, c.height);
    for (let y = 0; y < c.height; y++) {
      const src = (c.height - 1 - y) * rowBytes;
      img.data.set(px.subarray(src, src + rowBytes), y * rowBytes);
    }
    ctx2d.putImageData(img, 0, 0);
    pictureReq.resolve(c);
  }
}

function renderLoop(nowMs) {
  if (!state.needsFrame) return;      // <- the entire R2 claim lives on this line
  state.needsFrame = false;
  drawFrame(nowMs);
  // Deliberately not re-requesting: the next frame is scheduled by the next input.
}

function requestFrame() {
  state.needsFrame = true;
  requestAnimationFrame(renderLoop);
}

// ---------------------------------------------------------------------------------------------
// the per-frame pass, in one place
// ---------------------------------------------------------------------------------------------
//
// Both the live loop and `measureFrame()` call this, so the number on the panel is always the cost of
// the operation the renderer is actually running. Two copies of "the blit" is how a page ends up
// measuring a mechanism it has since replaced -- which is exactly what happened to the ablation matrix
// and cost this project its headline claim.
function blitFrame() {
  if (blitSupported) {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, cache.fbo);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
    // NEAREST, not LINEAR, and the filter is not a quality preference here.
    //
    // `cacheResize()` is only ever called with the canvas's own dimensions, so this blit is always 1:1
    // and there is nothing to interpolate. A `LINEAR` filter at 1:1 still runs the sampler: measured on
    // this sandbox against the texture-read fallback, `LINEAR` differed from it in 14 of 276 000 pixels
    // by one level, while a checkerboard test showed `LINEAR` mixing every pixel and `NEAREST` mixing
    // none. One level is invisible, but "invisible" is not the standard this project holds itself to
    // when an exact copy is available for free.
    //
    // IF THE CACHE EVER BECOMES SMALLER THAN THE CANVAS, THIS FILTER IS WRONG and must go back to
    // LINEAR, because a 1:1-only assumption would then turn a soft upscale into a blocky one. The
    // invariant is asserted in `tools/check-cache.mjs` rather than left in this comment.
    gl.blitFramebuffer(0, 0, cache.w, cache.h, 0, 0, canvas.width, canvas.height,
                       gl.COLOR_BUFFER_BIT, gl.NEAREST);
    // Restore BOTH bindings, explicitly.
    //
    // `gl.bindFramebuffer(gl.FRAMEBUFFER, null)` also works, but being explicit is the point: leaving
    // READ bound to the cache is not a theoretical hazard. `captureNow()` calls `gl.readPixels`, which
    // honours READ_FRAMEBUFFER, so the in-frame pixel probe read the CACHE instead of the screen and
    // reported mean luma 0.0 on both sides of a comparison that should have changed. `check-cache`'s
    // "cached image actually updates" is what caught it -- see the note above that assertion.
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  } else {
    gl.useProgram(cheapProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, cache.tex);
    gl.uniform1i(UQ.shaded, 0);
    gl.uniform2f(UQ.res, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
}

// ---------------------------------------------------------------------------------------------
// an UPPER BOUND on the frame cost, for devices with no GPU timer
// ---------------------------------------------------------------------------------------------
//
// Reference B has no EXT_disjoint_timer_query_webgl2, and `gl.finish()` there measures one refresh
// period (5.00 ms at 200 Hz) whatever the renderer did. So the one device R2 is written about cannot
// report a frame time at all, and no amount of polling changes that.
//
// This loop answers the only question that device can answer: is one frame's work geometrically
// incapable of being the bottleneck? It issues K blits, each reading a texture that was never sampled
// by anything else, and forces completion with readPixels. If K frames of real work take T ms, then one
// frame costs at most T/K.
//
// WHY THIS IS AN UPPER BOUND AND NOT A MEASUREMENT, stated plainly because the distinction is the whole
// point:
//
//   * readPixels is a synchronous stall, so the CPU waits for the GPU each iteration. The figure
//     therefore includes per-frame submission overhead that a pipeline would amortise.
//   * The first iteration pays whatever lazy setup the driver deferred; the per-frame figure inherits it.
//
// Both effects make the number LARGER than a pipelined frame, so an upper bound is the honest claim. It
// is also the useful direction: if the upper bound clears 1.5 ms, the true cost cannot fail it. If the
// upper bound exceeds 1.5 ms, the test is INCONCLUSIVE rather than a failure, and it says so.
//
// It cannot be done on the real cache texture: re-reading `tex` on the second and later iterations may
// be met by a cache hit, which would measure the cache rather than the read. `probeTex` exists for this
// and nothing else.
// ---------------------------------------------------------------------------------------------
// A DIRECT per-frame measurement, for devices without a GPU timer.
//
// `upperBoundBlit()` below answers "how fast can the GPU possibly be going", by amortising one stall
// over 64 frames. That is a useful number and it is an ESTIMATE: it is not a measurement of one frame,
// which is exactly the gap claim 4 has been parked on -- "one side is an amortised upper estimate and
// the other a median of an emulated call".
//
// This measures ONE frame, and it uses `fenceSync` rather than `finish()`. The difference matters for
// the same reason `upperBoundBlit()` documents: on a phone, `gl.finish()` returns at the next refresh
// boundary, so a per-frame finish measures the display. A fence is a completion marker for the command
// stream we submitted, not a presentation barrier, and it is legal to wait on it with a bounded
