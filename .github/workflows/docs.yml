name: Status documentation
on:
  push:
    branches: [main]
    paths:
      - 'odderon-v1/docs/**'
      - 'odderon-v1/**/*.md'
      - 'odderon-v1/scripts/check-status-sync.py'
      - '.github/workflows/**'
      - 'odderon-v1/web/onboarding.js'
      - 'odderon-v1/crates/odd-report/src/fdr.rs'
      - 'odderon-v1/crates/odd-contracts/src/lib.rs'
  pull_request:
    paths:
      - 'odderon-v1/docs/**'
      - 'odderon-v1/**/*.md'
      - 'odderon-v1/scripts/check-status-sync.py'
      - '.github/workflows/**'
      - 'odderon-v1/web/onboarding.js'
      - 'odderon-v1/crates/odd-report/src/fdr.rs'
      - 'odderon-v1/crates/odd-contracts/src/lib.rs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odderon-v1
    steps:
      - uses: actions/checkout@v5
      - name: Check shipped status constants
        run: python3 scripts/check-status-sync.py
