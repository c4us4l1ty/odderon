name: ci

# The compiler lives here, not on anyone's laptop.
#
# Odderon ships a JavaScript kernel (what the browser runs: 90 KB, no toolchain, instant load) and a
# Rust kernel (the reference implementation, and what will run the long-horizon work on wasm). Two
# kernels are only allowed to exist if a build proves they agree, so every push:
#
#   1. compiles the Rust kernel natively and for wasm32,
#   2. regenerates the vector file from the *JavaScript* kernel and makes the Rust tests replay it,
#   3. enforces the size and zero-assets budgets as hard failures,
#   4. runs the whole node suite in two emulated device classes.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write      # the diagnostics branch; nothing else writes to the repo

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  kernel:
    name: rust kernel (native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
      # the vectors come from the JavaScript kernel, so rust is tested against what actually ships
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: regenerate the JS kernel's vectors
        working-directory: .
        run: node test/vectors.mjs
      - name: fmt
        run: cargo fmt --all -- --check
        continue-on-error: true      # formatting is a style gate, not a correctness gate
      - name: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | tee /tmp/clippy.txt
      - name: test (including rust<->js parity)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-targets -- --nocapture 2>&1 | tee /tmp/test.txt
      # ---------------------------------------------------------------------------------------
      # The diagnostics channel. The Actions log blob is on a host that some environments cannot
      # reach, so on failure the compiler's own words are committed to a `ci-diag` branch and read
      # from there with plain git. If a toolchain is going to be the compiler, its error messages
      # have to travel.
      - name: publish diagnostics to the ci-diag branch
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p /tmp/diag
          { echo "# rust kernel diagnostics"; date -u; echo; echo "## clippy"; echo '```'; cat /tmp/clippy.txt 2>/dev/null | tail -c 60000; echo '```'; echo; echo "## cargo test"; echo '```'; cat /tmp/test.txt 2>/dev/null | tail -c 60000; echo '```'; } > /tmp/diag/kernel.md
          {
            echo "### clippy"
            grep -E '^(error|warning)' /tmp/clippy.txt 2>/dev/null | head -20 || true
          } >> "$GITHUB_STEP_SUMMARY"
          cd "$GITHUB_WORKSPACE"
          git config user.name "odderon-ci"
          git config user.email "ci@odderon.invalid"
          git checkout -B ci-diag
          mkdir -p diag
          cp /tmp/diag/kernel.md diag/kernel.md
          git add -f diag/kernel.md
          git commit -m "ci: rust kernel diagnostics for ${GITHUB_SHA}" --no-verify || true
          git push -f origin ci-diag || true
      - name: gate
        if: always()
        shell: bash
        run: |
          status=0
          grep -qE '^(error)' /tmp/clippy.txt && status=1
          grep -qE '(error\[|panicked|FAILED|test result: FAILED)' /tmp/test.txt && status=1
          exit $status

  wasm:
    name: wasm32 (${{ matrix.profile }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    strategy:
      fail-fast: false
      matrix:
        profile: [release, size]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
      - name: install wasm-opt
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz \
            | tar -xz -C /tmp
          echo "/tmp/binaryen-version_123/bin" >> $GITHUB_PATH
      - name: build (${{ matrix.profile }})
        # the cdylib is the artifact; the rlib has no wasm target and would fail to link, so we build
        # the library only (--lib) and never the test harness
        run: |
          if [ "${{ matrix.profile }}" = "size" ]; then
            # size profile: opt-level="z"; LTO and codegen-units are already set in Cargo.toml
            RUSTFLAGS="-C opt-level=z" cargo build --release --lib --target wasm32-unknown-unknown
          else
            cargo build --release --lib --target wasm32-unknown-unknown
          fi
      - name: optimise
        run: |
          mkdir -p out
          for f in target/wasm32-unknown-unknown/release/*.wasm; do
            wasm-opt -Oz --strip-debug --strip-producers "$f" -o "out/$(basename "$f")" || cp "$f" "out/$(basename "$f")"
            ls -l "out/$(basename "$f")"
          done
      - name: size gate (400 KB budget, 512 KB hard fail)
        run: |
          total=0
          for f in out/*.wasm; do total=$((total + $(stat -c%s "$f"))); done
          echo "wasm payload: $total bytes ($((total / 1024)) KB)"
          echo "### wasm kernel: $((total / 1024)) KB" >> $GITHUB_STEP_SUMMARY
          test "$total" -lt 524288 || { echo "::error::wasm payload over 512 KB"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.profile }}
          path: kernel/out/*.wasm
          if-no-files-found: error

  web:
    name: web (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: suite
        run: node test/run.mjs
      - name: cold payload gate
        run: |
          kb=$(du -sk game index.html | awk '{s+=$1} END {print s}')
          echo "cold payload (source): ${kb} KB"
          echo "### cold payload: ${kb} KB" >> $GITHUB_STEP_SUMMARY
          test "$kb" -lt 512
      - name: zero binary assets
        run: |
          bad=$(git ls-files | grep -Ei '\.(png|jpe?g|webp|gif|glb|gltf|fbx|obj|dae|wav|mp3|ogg|hdr|exr|ktx2?|dds|bin)$' || true)
          if [ -n "$bad" ]; then echo "::error::binary assets found:"; echo "$bad"; exit 1; fi
          echo "zero binary assets: every pixel is arithmetic"

  emulated:
    name: emulated (${{ matrix.device }})
    runs-on: ubuntu-latest
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: android-8-class
            share: 12          # 12% of a core: a 2018 phone throttling in a warm pocket
          - device: uhd-2015-laptop
            share: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: suite under throttle (${{ matrix.share }}% cpu)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cpulimit
          start=$(date +%s%N)
          cpulimit -l ${{ matrix.share }} -- node test/run.mjs
          end=$(date +%s%N)
          echo "${{ matrix.device }}: suite took $(( (end - start) / 1000000 )) ms"
          echo "### ${{ matrix.device }}: $(( (end - start) / 1000000 )) ms" >> $GITHUB_STEP_SUMMARY
