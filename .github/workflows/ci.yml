name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------------------------
  # HARD GATES. These fail the build. Everything else in this file is advisory until the
  # bootstrap is green once (see docs/BUILD-PLAN.md §3 — style gates are armed after the first
  # successful run, because the first run is compile-unverified by construction).
  # -------------------------------------------------------------------------------------------

  test-native:
    name: test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        # Warnings are not denied here on purpose: this job's question is "is the physics right?",
        # and a warning must not mask that answer. The lint jobs enforce style with -D warnings.
        run: bash ci/annotate.sh "cargo test" cargo test --workspace --all-targets
      - name: determinism hash (native)
        run: cargo test -p odderon-dmath --test '*' -- --nocapture
      - name: publish hash for cross-platform comparison
        run: |
          cargo test -p odderon-dmath determinism_golden -- --nocapture 2>&1 \
            | grep -oE '0x[0-9a-f]{16}' | head -1 > native-hash.txt || true
          echo "native hash: $(cat native-hash.txt 2>/dev/null || echo 'unknown')"
      - uses: actions/upload-artifact@v4
        with:
          name: native-hash
          path: native-hash.txt
          if-no-files-found: ignore

  build-wasm:
    name: build (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (release, wasm32)
        run: bash ci/annotate.sh "cargo build wasm32" cargo build --release --target wasm32-unknown-unknown --workspace
      # The artifact is the point: it comes back into the dev sandbox via `gh run download`, where
      # the cross-platform determinism check can be run against a *real* wasm binary. Building Rust
      # is what the sandbox cannot do; *running* wasm it can.
      # The cross-platform determinism check, run where both halves exist. Artifact downloads are
      # blocked for some clients, so the comparison is closed here rather than exported: compile a
      # tiny host that prints the wasm-side hash, and compare it with the native-side hash computed in
      # the same job. Same crate, two targets, one number.
      - name: determinism — native vs wasm32 in one job
        run: |
          set -euo pipefail
          cat > /tmp/dmath_hash.rs <<'RS'
          fn main() {
              println!("{:#018x}", odderon_dmath::golden_hash());
          }
          RS
          mkdir -p crates/odderon-dmath/examples
          cp /tmp/dmath_hash.rs crates/odderon-dmath/examples/dmath_hash.rs
          NATIVE=$(cargo run -q -p odderon-dmath --example dmath_hash)
          echo "native : $NATIVE"

          # Build the wasm cdylib and read its hash with Node's native wasm support — no browser, no
          # bindings generator, because the module is deliberately import-free.
          cargo build -q --release --target wasm32-unknown-unknown -p odderon-dmath-wasm
          WASM_PATH=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name 'odderon_dmath_wasm.wasm' | head -1)
          WASM=$(node -e "
            const fs=require('fs');
            const m=new WebAssembly.Module(fs.readFileSync('$WASM_PATH'));
            const i=new WebAssembly.Instance(m,{});
            const h=i.exports.golden();
            console.log('0x'+h.toString(16).padStart(16,'0'));
          ")
          echo "wasm   : $WASM"

          node -e "require('fs').writeFileSync('/tmp/det.txt', 'native=$NATIVE wasm=$WASM\\n')"
          cat /tmp/det.txt
          if [ "$NATIVE" != "$WASM" ]; then
            echo "::error::DETERMINISM FAILURE: native $NATIVE != wasm $WASM"
            exit 1
          fi
          echo "PASS: native and wasm32 agree bit-for-bit"

      - name: stage wasm artifacts
        run: |
          mkdir -p dist
          find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' -exec cp {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist/
          if-no-files-found: error
          retention-days: 30

  kernel-policy:
    name: kernel policy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The rules live in ci/kernel-policy.sh so they can be read, run locally, and tested by
      # injecting a violation. Rationale for each rule: docs/DETERMINISM.md §1.3.
      - name: kernel policy
        run: bash ci/kernel-policy.sh

  # -------------------------------------------------------------------------------------------
  # ADVISORY during bootstrap. Armed after the first green run — see the decision in
  # docs/BUILD-PLAN.md §3. They are kept in the same file so arming them is a one-word diff.
  # -------------------------------------------------------------------------------------------

  fmt:
    name: rustfmt (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83.0"
          components: rustfmt
      - run: bash ci/annotate.sh "rustfmt" cargo fmt --all -- --check

  clippy:
    name: clippy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83.0"
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash ci/annotate.sh "clippy" cargo clippy --workspace --all-targets -- -D warnings
