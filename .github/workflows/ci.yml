name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------------------------
  # HARD GATES. These fail the build. Everything else in this file is advisory until the
  # bootstrap is green once (see docs/BUILD-PLAN.md §3 — style gates are armed after the first
  # successful run, because the first run is compile-unverified by construction).
  # -------------------------------------------------------------------------------------------

  test-native:
    name: test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # A workflow that does not parse fails SILENTLY: no job, no log, no annotation, and no checks on
      # the PR -- just "This run likely failed because of a workflow file issue". On 2026-11-24 a step
      # name containing `(before: blit only)` cost a push that way. Validating the file first turns a
      # silent non-run into a red step with a line number.
      #
      # It runs on a checkout of the branch under test, so the file being validated is the one that
      # would run rather than the one on main.
      - run: npm install --no-audit --no-fund
      - name: workflows parse
        run: node tools/check-workflows.mjs
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (hard gate)
        # Two deliberate oddities, both about where diagnostics can be read rather than about how
        # strict the gate is:
        #
        # * `--exclude odderon-dmath-wasm` — that crate is a `no_std` cdylib with a wasm-only panic
        #   handler, so building it for the host cannot work by construction. Its correctness is
        #   covered by the determinism step, which loads it *as wasm*.
        # * `|| true` followed by an explicit check — a failing step reports one line and keeps its log
        #   in blob storage, which some clients cannot reach; a completing step publishes its output.
        #   So the step completes, prints a summary, and then fails for real.
        #
        # Warnings are not denied here on purpose: this job's question is "is the physics right?", and
        # a warning must not mask that answer. The lint jobs enforce style.
        run: |
          set -o pipefail
          cargo test --workspace --exclude odderon-dmath-wasm --all-targets 2>&1 \
            | tee /tmp/test.log || true
          # Everything below must reach the *annotation*, not just the job log, because the job log
          # is not always readable. Two files, one purpose each: SUMMARY is printed for humans, and
          # the same lines are %0A-encoded for the annotation, which is what a restricted client sees.
          SUMMARY=/tmp/summary.txt
          : > "$SUMMARY"
          fail_with() {
            echo "======================= SUMMARY ======================="
            cat "$SUMMARY"
            echo "======================================================="
            ENCODED=$(sed -e 's/%/%25/g' -e 's/\r$//' "$SUMMARY" | awk '{ printf "%s%%0A", $0 }')
            printf '::error title=%s::%s\n' "$1" "$ENCODED"
            exit 1
          }

          if ! grep -qE "^test result: ok" /tmp/test.log; then
            grep -E "^test result|FAILED|panicked at|^error(\[|:)|^[[:space:]]+-->" /tmp/test.log \
              || tail -40 /tmp/test.log
          else
            true
          fi > "$SUMMARY" || true

          if [ ! -s "$SUMMARY" ] && grep -qE "\.\.\. FAILED|panicked at|^error(\[|:)" /tmp/test.log; then
            grep -A1 -E "^test .* FAILED|panicked at|^error(\[|:)|^[[:space:]]+-->" /tmp/test.log > "$SUMMARY" || true
            [ -s "$SUMMARY" ] || true
          fi

          if [ -s "$SUMMARY" ]; then
            fail_with "cargo test"
          fi
          grep -E "^test result" /tmp/test.log

      - name: determinism hash (always readable)
        # The bootstrap value must be readable from CI with no log access at all, because the only
        # channel that reliably works here is a check-run annotation. So: run the hash example on its
        # own, and echo the result as an annotation whether or not golden.txt exists. This step must
        # never fail — the determinism *gate* is the next step's job.
        run: |
          set +e
          HASH=$(cargo run -q -p odderon-dmath --example hash 2>/dev/null)
          echo "computed determinism hash: ${HASH:-UNAVAILABLE}"
          echo "::notice title=determinism hash::${HASH:-UNAVAILABLE}"
      - name: determinism gate (golden.txt)
        # Separate from the test run so that its failure says the useful thing as an annotation:
        # which hash was expected, which was computed. A bare "test failed" is unactionable when the
        # log is out of reach.
        run: |
          set +e
          OUT=$(cargo test -q -p odderon-dmath determinism_golden -- --nocapture 2>&1)
          STATUS=$?
          if [ $STATUS -eq 0 ]; then
            echo "golden hash matches committed value"
            echo "$OUT" | grep -oE '0x[0-9a-f]{16}' | head -1 > native-hash.txt
            exit 0
          fi
          GOT=$(cargo run -q -p odderon-dmath --example hash 2>/dev/null)
          WANT=$(cat crates/odderon-dmath/tests/golden.txt 2>/dev/null || echo "(absent)")
          echo "::error title=determinism golden mismatch::computed ${GOT:-?}, committed ${WANT}"
          echo "computed: ${GOT:-?}"
          echo "committed: ${WANT}"
          echo "${GOT:-unknown}" > native-hash.txt
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-hash
          path: native-hash.txt
          if-no-files-found: ignore

  build-wasm:
    name: build (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (release, wasm32)
        run: bash ci/annotate.sh "cargo build wasm32" cargo build --release --target wasm32-unknown-unknown --workspace
      # The artifact is the point: it comes back into the dev sandbox via `gh run download`, where
      # the cross-platform determinism check can be run against a *real* wasm binary. Building Rust
      # is what the sandbox cannot do; *running* wasm it can.
      # The cross-platform determinism check, run where both halves exist.
      #
      # This is the first client-side verification of the claim that makes everything else possible:
      # the kernel produces identical bits natively and in wasm, so a mission replay is auditable.
      # It has to run inside CI because artifact downloads are blocked for some clients.
      - name: determinism — native vs wasm32, same job
        run: bash ci/determinism.sh

      # The static gate runs in `shell-claims`; this runs it again WITH the real binary, so the export
      # list, the reference orbit and the full-period closure are checked against the code the build
      # actually produced rather than against the source's intentions. This is the only place in the
      # project where the wasm boundary can be executed at all: the crate is a `cdylib` with a wasm-only
      # panic handler, so it cannot be built or tested on the host.
      - name: orbit boundary (exports agree with physics)
        run: node tools/check-orbit.mjs --wasm target/wasm32-unknown-unknown/release/odderon_dmath_wasm.wasm

      # The pad's P1 gate, against the same binary: the under-specified chilldown cavitates, the specified
      # one survives, and the same input log reproduces the same failure time. Static half in `shell-claims`.
      - name: pad boundary (a reproducible failure from the input log)
        run: node tools/check-pad.mjs --wasm target/wasm32-unknown-unknown/release/odderon_dmath_wasm.wasm

      - name: stage wasm artifacts
        run: |
          mkdir -p dist
          find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' -exec cp {} dist/ \;
          ls -la dist
      # CLAIM 2, IN THE PAGE, AGAINST THE REAL KERNEL.
      #
      # This is the only job where the module and a browser exist together, so it is the only place the
      # room can be checked end to end: the panel's numbers are compared against the module's own exports
      # computed independently, and the pixels are compared across a curtain toggle. It was shown failing
      # four ways -- against the pre-fix page (no room at all), against a page that derives SHGC itself,
      # against setCurtain without the cache invalidation, and against a **decorative** room hardcoded to
      # `0.083` that produced the same image, the same text and the same pixel change.
      - run: npm install --no-audit --no-fund
      - name: chromium (SwiftShader)
        run: node tools/unpack-chromium.mjs
      - name: the room's light comes from the thermal kernel
        run: node tools/check-room.mjs
        env:
          LD_LIBRARY_PATH: /tmp/al2023/lib
      # THE ABSENCE HAS TO BE VISIBLE, and this job is the only place it can be tested: it has the built
      # module AND a browser, so it can take the module away and look at what the page does. On a clean
      # clone the page said `— no kernel` over a hole onto a flat horizon, and a reader reasonably
      # concluded that the hole WAS the room. A missing build output is not a defect; reporting it as an
      # unexplained blank is.
      # THE FULL CLOCK: the kernel's trajectory, the page's rate against wall time, the cache actually
      # re-shading, and R2 surviving a twenty-second run. This is the check that reads the cache rather than
      # a screenshot, because a screenshot of this page has a stopwatch drawn on it -- the earlier version
      # measured the panel's own digits and called it the room.
      - name: time in the room (the clock, the cache, and R2)
        run: node tools/check-room-clock.mjs
        env:
          LD_LIBRARY_PATH: /tmp/al2023/lib
      - name: a missing kernel is declared, explained and actionable
        run: node tools/check-missing-kernel.mjs
        env:
          LD_LIBRARY_PATH: /tmp/al2023/lib
      # ...and the PREVIEW must be able to serve the kernel at all. `dist/` is git-ignored, so a server
      # started from a clone had nothing to serve and the page could only draw geometry -- while CI, which
      # downloads the artifact, was green. The preview is the one place the game is actually looked at, so
      # "you cannot see it here" is not an acceptable answer. `tools/serve.mjs` now falls back to cargo's
      # own release directory; this check empties `dist/`, fetches the module over HTTP, INSTANTIATES it
      # and calls the room exports, so a 200 with the wrong bytes fails.
      - name: the dev server serves the kernel even with dist/ empty
        run: node tools/check-serve-dist.mjs
        env:
          LD_LIBRARY_PATH: /tmp/al2023/lib
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist/
          if-no-files-found: error
          retention-days: 30

  kernel-policy:
    name: kernel policy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The rules live in ci/kernel-policy.sh so they can be read, run locally, and tested by
      # injecting a violation. Rationale for each rule: docs/DETERMINISM.md §1.3.
      - name: kernel policy
        run: bash ci/kernel-policy.sh

  class-certification:
    name: class certification lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The licence gate for the *compiled* kernel, as opposed to the data manifest gate in
      # docs/DATA-LICENSING.md §3.2. A hard gate, not advisory: "100% commercially legal from Day 1"
      # is not a claim that can be made by a document nobody runs (docs/CLASSES.md).
      #
      # Both steps run even when the first fails, because the useful report names every finding, and a
      # gate that stops at the first one makes two pushes out of one mistake.
      - name: class gate
        run: node tools/check-classes.mjs
      - name: class gate self-test
        # Proves the gate can fail. A checker that cannot fail prints `ok` too.
        if: always()
        run: node tools/check-classes-selftest.mjs

  shell-claims:
    name: shell claims (1, 3, 5-artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      # The static path resolver shared by `tools/serve.mjs` and `tools/check-shell.mjs`. No browser and
      # no npm needed -- it is pure Node -- so it runs here rather than after a 20 s Chromium unpack.
      # This exists because the resolver had a real arbitrary-file-read: `/dist/../.git/config` returned
      # the repository's own git config with status 200. See `tools/static-path.mjs` for the mechanism.
      - name: static path resolver (no traversal out of web/ or dist/)
        run: node tools/check-static-path.mjs
      # `web/index.html` keeps its fragment shader in a JavaScript template literal, so ONE backtick in a
      # GLSL comment -- and GLSL comments are full of words like 'patch' -- closes the literal early and
      # the module never runs. The symptom is a blank canvas with no WebGL error at all. Four edits to the
      # room scene hit this and each one cost a render cycle to find. Counting backticks does not detect
      # it (the count stays even); asking Node to parse the script does.
      - name: the page's module script parses
        run: node tools/check-script-syntax.mjs
      # THE ORBIT STUB GATE. `web/index.html` drew its satellite with a local Kepler solver for the whole
      # life of the file, labelled as a stand-in in three separate comments, and no check noticed -- every
      # check asked whether the page rendered, and the stand-in rendered perfectly. A comment describing
      # work still to do is not a guard; this is.
      #
      # It fails if the page re-grows a local solver, a local `mu`, a hand-written circular-orbit speed,
      # or a silent fallback for a missing kernel. Static on purpose: no browser, no wasm, sub-second.
      - name: orbit comes from the kernel, not from a JS stub
        run: node tools/check-orbit.mjs
      # The verifier's rejection path, exercised. The `--wasm` branch only ever runs in `build-wasm`,
      # so without this the code that is supposed to catch a wrong boundary would first run in the same
      # job it is guarding. A test whose failing branch has never executed has not been shown to fail.
      - name: orbit verifier self-test (accepts good exports, rejects bad)
        run: node tools/check-orbit.mjs --selftest

      - name: the pad drives the kernel and defaults to the under-specified first load
        run: node tools/check-pad.mjs

      - name: pad verifier self-test (accepts good exports, rejects bad)
        run: node tools/check-pad.mjs --selftest
      # On 2026-11-24 this job failed on a condition the page handles correctly: the optional wasm
      # artifact is absent on a clean checkout, the browser logs a 404, and `tools/screenshot.mjs` treats
      # any console error as an untrustworthy frame. The capture now exempts that one error -- but only
      # when the page itself declares the kernel unavailable. This asserts the exemption is narrow: the
      # same 404 with no declaration, or with a page claiming the kernel loaded, still fails.
      - name: screenshot error classification (exemption is narrow)
        run: node tools/check-screenshot-errors.mjs
      # `BUILD-PLAN.md` §4 claim 3 is "idle is nothing scheduled": zero rAF calls, zero timers, zero
      # allocations after 250 ms of no input. The instrument already measured that, but only when a human
      # remembered to run it -- `tools/check-shell.mjs` was never wired into CI, so the claim rested on
      # somebody having looked at one point. That is the stored-assumption failure this project keeps
      # finding, so the check now runs on every push and can fail the branch.
      #
      # What this job CANNOT do: measure frame time. The runner has SwiftShader, a CPU rasteriser, so a
      # timing number from here is meaningless -- `tools/check-shell.mjs` says so in its own output and
      # claims 4's 1.25 ms comes from real hardware (Reference B). What is gated here is the *behaviour*:
      # that the shader compiles, that the page renders, and that it stops drawing when idle.
      - name: shell instrument (render-on-demand + claim 1 + claim 3)
        run: node tools/unpack-chromium.mjs && node tools/check-shell.mjs
        env:
          LD_LIBRARY_PATH: /tmp/al2023/lib
      # `tools/check-cache.mjs` is the standing test for the temporal cache, and it was not in CI. It
      # was run when somebody remembered, on one machine, and that is the stored-assumption failure
      # this project keeps finding: a test nobody runs is a claim, not a check. It shares the Chromium
      # unpack above, so it costs ~6 s here rather than a second job.
      #
      # It is also purely behavioural -- 0 shades vs 1 shade, does the cache follow a resize -- so it is
      # safe on a CPU rasteriser. Nothing in it reads a timing number.
      - name: temporal cache (blit when unchanged, shade on change)
        run: node tools/check-cache.mjs
        env:
          LD_LIBRARY_PATH: /tmp/al2023/lib
      # The saved PNG's instrument panel has to be the panel a person sees. It was not: `capturePicture()`
      # serialised `#hud` without the document's stylesheet, so the panel was rasterised with no CSS at
      # all and values printed on top of their own labels -- in the artifact claim 5 is argued from, while
      # the live page was correct and every other check therefore passed. This captures both and compares
      # the text.
      # THE PIXEL CLAUSE AND ITS DOC MUST BE THE SAME NUMBER. `MAX_PIXELS` was a bare 1,150,000 with no
      # derivation, disagreeing with GRAPHICS.md's 0.68 Mpx -- and that 0.68 was itself derived from a
      # texture-read row this project retracted. Both numbers are now derived from the 1.27 ms
      # `blitFramebuffer` row and the quoted 15% margin, and this step fails if the code, the doc and
      # the arithmetic ever drift apart again. Pure arithmetic over source text, so no browser.
      - name: pixel clause matches its derivation and the doc
        run: node tools/check-pixel-budget.mjs
      # CLAIM 2's SOURCE CONTRACT. The thermal network has measured the room for months while no pixel
      # read it, and the failure mode once it does is subtle: a brightness constant that happens to look
      # right produces the same image as a solver. The FULL check needs the wasm kernel and a browser, so
      # it runs in `build-wasm`; this half needs neither and still catches the two failures a page grows
      # on its own -- physics re-derived in the presenter, and a curtain that forgets to invalidate the
      # cache (which renders the room once, before the kernel answers, and blits it forever).
      - name: the room's light comes from the thermal kernel (source contract)
        run: node tools/check-room.mjs --static
      # CLAIM 2's SECOND HALF, THE PART THAT NEEDS TIME. "The room cools" is a claim about a trajectory, and
      # this half needs neither the wasm kernel nor a browser: it pins the page's clock constants, the cache
      # rule that makes the trajectory reach the picture, and the T^4 coupling that is the only physically
      # available way visible pixels can carry it. It runs here so a page that drops the temperature from
      # `cacheInvalidated()` -- which happened, and which four earlier pixel checks could not see -- fails
      # without waiting for the wasm job.
      - name: the room cools, and the page's clock is derived (source contract)
        run: node tools/check-room-clock.mjs --static
      - name: saved picture's panel matches the page
        run: node tools/check-hud-capture.mjs
        env:
          LD_LIBRARY_PATH: /tmp/al2023/lib
      # `tools/check-ablation.mjs` tests the ablation report's *judgement* rather than a measurement: it
      # feeds `summarise()` known matrices and asserts that the page refuses to call a set of deltas
      # findings when its own control disagrees. This is the test for the 43% self-disagreement that
      # `BUILD-PLAN.md` records -- and the reason it needs to run every push is that the failure it
      # catches is a page that prints plausible numbers with no error, which no human reading a report
      # will notice.
      #
      # It needs no Chromium and no network: it extracts `summarise()` from the page by brace matching
      # and runs it in Node. So it runs here, cheaply, before the browser steps.
      - name: ablation report judgement (no verdict without a control)
        run: node tools/check-ablation.mjs
      - name: screenshot the frame
        # Claim 5 is a judgement, and the only way to put a judgement in front of a reviewer is pixels.
        # The capture is uploaded rather than committed: R5 forbids binary assets in the tree, and
        # `.artifacts/` is gitignored for exactly this purpose.
        if: always()
        run: node tools/screenshot.mjs --width 1600 --height 1000 --out .artifacts/shell.png
        env:
          LD_LIBRARY_PATH: /tmp/al2023/lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-frame
          path: .artifacts/shell.png
          if-no-files-found: warn

  # -------------------------------------------------------------------------------------------
  # STYLE GATES. Armed 2026-11-23, once both were green on `main` — the condition docs/BUILD-PLAN.md
  # §3 set for arming them. Until then they were `continue-on-error: true`, which meant the gate could
  # not fail the branch and a red result carried no information.
  #
  # Arming them is not a licence to let them rot: if one goes red, fix it in a separate commit so that a
  # formatting slip is attributable, rather than mixed into a physics change where nobody can tell which
  # half broke. `docs/BUILD-PLAN.md` §4b records the same rule for measurements.
  # -------------------------------------------------------------------------------------------

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83.0"
          components: rustfmt
      # NOTE: the annotation is capped at six diffs, so a run showing six is a *truncated list*, not the
      # whole problem. That is what made clearing this gate slow on 2026-11-23: each round of six revealed
      # six more, across eleven files. If it goes red again, clear the file this job names *whole*, at the
      # width this rustfmt uses, instead of chasing hunks.
      #
      # Two traps, both hit for real:
      #  * the sandbox has no Rust toolchain, so a formatter edit cannot be checked before it is pushed;
      #  * an older bundled rustfmt disagrees with this pinned one (it splits `Elements { e: 1.5, ..el }`
      #    where 1.83.0 keeps it on one line), so it is not a safe oracle for a file that is already green.
      - run: bash ci/annotate.sh "rustfmt" cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83.0"
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The wasm shell is excluded for the same reason as in the test job: it is a no_std cdylib with
      # a wasm-only panic handler, so it cannot be checked for the host. Its lints are covered as part
      # of the wasm32 build.
      - run: bash ci/annotate.sh "clippy" cargo clippy --workspace --exclude odderon-dmath-wasm --all-targets -- -D warnings
