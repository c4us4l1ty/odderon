name: Rust foundation
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Run workspace tests
        shell: bash
        run: |
          set +e
          cargo test --workspace --color never 2>&1 | tee /tmp/odderon-cargo-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 -c 'from pathlib import Path; s="\n".join(Path("/tmp/odderon-cargo-test.log").read_text().splitlines()[-50:]); print("::error::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$status"
      - name: Show generated dependency lockfile
        run: echo "::notice title=Dependency lock::$(base64 -w0 Cargo.lock)"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --target wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
