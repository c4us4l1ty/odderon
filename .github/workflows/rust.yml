name: Rust foundation
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Verify bundled ephemeris checksum
        run: echo '8f651100deaaffbae85ae4dac2a577b805993e8e4cfbe7dd8b710913ece36335  data/packed/de440s-2020-2036.ephb' | sha256sum --check
      - name: Run workspace tests
        shell: bash
        run: |
          set +e
          cargo test --locked --workspace --color never 2>&1 | tee /tmp/odderon-cargo-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 -c 'from pathlib import Path; s="\n".join(Path("/tmp/odderon-cargo-test.log").read_text().splitlines()[-50:]); print("::error::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$status"
      - name: Report warmed orbital conversion throughput (informational)
        shell: bash
        run: |
          result=$(cargo run --release --locked -p odd-astro --example elements_benchmark)
          echo "$result"
          echo "::notice::$result"
      - name: Reproduce the packed ephemeris from the pinned SPK subset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          (
            set -e
            gh api -H 'Accept: application/vnd.github.raw+json' repos/laurpaul/LunarMaps/git/blobs/5613b931809458da8ef89673f95536b66a16a5de > /tmp/de440s-subset.bsp
            echo 'f2ca56c14a88fa6a61d599daa40d12ae85ac25f204870fbc623d433c9a57cc37  /tmp/de440s-subset.bsp' | sha256sum --check
            cargo run --locked -p pack-ephem -- --range 631108800 1136030400 /tmp/de440s-subset.bsp /tmp/de440.ephb
            cmp /tmp/de440.ephb data/packed/de440s-2020-2036.ephb
          ) 2>&1 | tee /tmp/odderon-pack.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 -c 'from pathlib import Path; s="\n".join(Path("/tmp/odderon-pack.log").read_text().splitlines()[-30:]); print("::error::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$status"
      - name: Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --locked --workspace --all-targets --color never -- -D warnings 2>&1 | tee /tmp/odderon-clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 -c 'from pathlib import Path; s="\n".join(Path("/tmp/odderon-clippy.log").read_text().splitlines()[-50:]); print("::error::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$status"
      - run: cargo build --locked --workspace --target wasm32-unknown-unknown
      - run: cargo build --locked -p odd-core-oracle && cargo build --locked -p odd-core-oracle --lib --target wasm32-unknown-unknown
      - name: Compare native and browser WebAssembly fixtures
        shell: bash
        run: |
          set +e
          node tools/core-oracle/check-parity.mjs 2>&1 | tee /tmp/odderon-parity.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 -c 'from pathlib import Path; s="\n".join(Path("/tmp/odderon-parity.log").read_text().splitlines()[:30]); print("::error::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$status"
      - name: Check formatting
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check 2>&1 | tee /tmp/odderon-fmt.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 -c 'from pathlib import Path; s=Path("/tmp/odderon-fmt.log").read_text(); print("::error::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$status"

      - name: Build browser ephemeris module
        run: |
          cargo build --locked --release -p odd-view --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/odd_view.wasm web/odd_view.wasm
      - name: Upload browser ephemeris module
        uses: actions/upload-artifact@v4
        with:
          name: odd-view-wasm
          path: web/odd_view.wasm
      - name: Install browser test dependency
        run: npm ci
      - name: Test browser viewport and idle governor
        shell: bash
        run: |
          set +e
          (npm test && npm run test:browser && ODDERON_BASELINE=1 npm run test:idle && ODDERON_PINNED_CHROMIUM=1 npm run test:idle) 2>&1 | tee /tmp/odderon-browser.log
          status=${PIPESTATUS[0]}
          while IFS= read -r line; do echo "::notice::$line"; done < <(grep -E '^(Blank-tab control|Idle after camera drag|CPU report only)' /tmp/odderon-browser.log)
          if [ "$status" -ne 0 ]; then
            python3 -c 'from pathlib import Path; s="\n".join(Path("/tmp/odderon-browser.log").read_text().splitlines()[-50:]); print("::error::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$status"
