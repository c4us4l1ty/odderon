name: Odderon III browser game
on:
  push:
    branches: [main, 'arena/**']
    paths: ['odderon-v3/**', 'odderon-v1/crates/**', 'odderon-v1/Cargo*', 'odderon-v1/web/**', 'odderon-v1/data/**', '.github/workflows/odderon-v3.yml']
  pull_request:
    paths: ['odderon-v3/**', 'odderon-v1/crates/**', 'odderon-v1/Cargo*', 'odderon-v1/web/**', 'odderon-v1/data/**', '.github/workflows/odderon-v3.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: odderon-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: odderon-v3/package-lock.json
      - name: Test the shared Rust flight model
        working-directory: odderon-v1
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p odd-view --features cockpit --all-targets -- -D warnings
          cargo test --release --locked -p odd-view -p odd-verify -p odd-contracts -p odd-systems --features odd-view/cockpit --lib --tests
      - name: Compile the local game (no authority service)
        working-directory: odderon-v1
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p odd-view --features cockpit
          cp target/wasm32-unknown-unknown/release/odd_view.wasm ../odderon-v3/runtime/
      - name: Test the emitted ABI and assemble the offline distro
        working-directory: odderon-v3
        run: |
          npm ci
          npm test
          npm run build
      - name: Exercise the browser distro
        working-directory: odderon-v3
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: odderon-v3-browser
          path: odderon-v3/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: odderon-v3-rust-runtime
          path: odderon-v3/runtime/odd_view.wasm
          if-no-files-found: error
