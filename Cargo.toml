[workspace]
members = ["crates/odd-core", "crates/odd-astro", "crates/odd-sim", "crates/odd-contracts", "crates/odd-app", "crates/odd-identity", "crates/odd-report", "crates/odd-verify", "crates/odd-propulsion", "crates/odd-systems", "tools/core-oracle", "crates/odd-ephem", "tools/pack-ephem", "crates/odd-view", "crates/odd-worker"]
resolver = "2"
# The wasm-only Cloudflare deployment crate is built in CI with network
# (workers-rs is not vendored); it is excluded so offline resolution stays clean.
exclude = ["crates/odd-worker-cloudflare"]
