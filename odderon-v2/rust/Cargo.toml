[package]
name = "odderon-core"
version = "0.2.0"
edition = "2021"
description = "Deterministic flight core for Odderon 2, compiled to wasm32"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
name = "odderon_core"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
